<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Finance Intern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ==================================================================
     Finance Intern — presentation layer only.
     CONTAINS NO FIGURES. Every number is read from data/finance.json.
     Palette lifted from Steven (steven_os_home.html) for consistency.
     ================================================================== */
  :root{
    color-scheme: light;
    --canvas:#ece1cd; --paper:#f8f0e2; --paper-2:#f1e7d5;
    --ink:#33291d; --ink-soft:#7b6a52; --ink-faint:#a8967a;
    --clay:#af6a3e; --clay-deep:#8f5330; --caramel:#c48a4c; --clay-soft:#f0e0cd;
    --pine:#5e6b4d; --pine-soft:#e6e6d3; --pine-deep:#46513a;
    --line:#e3d5bd; --line-soft:#ece1cc;
    --shadow: 0 1px 2px rgba(60,44,26,.05), 0 10px 26px -14px rgba(60,44,26,.22);
    --shadow-lg: 0 3px 8px rgba(60,44,26,.08), 0 26px 60px -22px rgba(60,44,26,.34);
    --r:16px; --r-sm:11px; --r-lg:22px;
    --serif:"Fraunces","Iowan Old Style",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    /* categorical series — warm, all legible on paper */
    --c1:#af6a3e; --c2:#5e6b4d; --c3:#c48a4c; --c4:#7d8ba1; --c5:#9a6b70; --c6:#8a8f6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans); background:var(--canvas); color:var(--ink);
       -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;}
  ::selection{background:var(--clay-soft);}
  a{color:inherit;}

  /* ============ SIGN-IN GATE ============ */
  .gate{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
        background:#241c12; overflow:hidden; transition:opacity .7s ease, visibility .7s;}
  .gate::before{content:""; position:absolute; inset:0;
    background:
      radial-gradient(900px 600px at 20% 10%, rgba(175,106,62,.30), transparent 60%),
      radial-gradient(800px 520px at 85% 90%, rgba(94,107,77,.26), transparent 62%),
      linear-gradient(180deg, rgba(38,26,14,.55), rgba(26,18,9,.88));}
  .gate.hide{opacity:0; visibility:hidden;}
  .gate-card{position:relative; z-index:2; width:min(88vw,340px); text-align:center; color:#f6ecda; padding:8px;}
  .gate-mark{font-family:var(--serif); font-weight:500; font-size:15px; letter-spacing:.34em;
             text-transform:uppercase; opacity:.78; margin-bottom:24px;}
  .gate-title{font-family:var(--serif); font-weight:500; font-size:52px; line-height:1; margin:0 0 10px;}
  .gate-sub{font-size:13.5px; opacity:.72; margin-bottom:34px;}
  .pin{display:flex; gap:11px; justify-content:center; margin-bottom:22px;}
  .pin i{width:13px; height:13px; border-radius:50%; border:1.5px solid rgba(246,236,218,.55); display:block; transition:.2s;}
  .pin i.on{background:#f6ecda; border-color:#f6ecda;}
  .enter{appearance:none; border:0; cursor:pointer; font-family:var(--sans); font-size:14px; font-weight:500;
         color:#241c12; background:#f6ecda; padding:12px 30px; border-radius:100px; transition:.2s;}
  .enter:hover{transform:translateY(-1px); background:#fff;}
  .gate-lock{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; letter-spacing:.06em;
             text-transform:uppercase; opacity:.55; margin-top:26px;}

  /* ============ APP ============ */
  .app{display:none;} .app.show{display:block;}
  .wrap{max-width:1400px; margin:0 auto; padding:24px clamp(16px,3vw,38px) 70px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
          padding-bottom:18px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:11px;}
  .brand-badge{width:36px; height:36px; border-radius:11px; flex:none;
    background:linear-gradient(150deg,var(--clay),var(--clay-deep)); display:flex; align-items:center;
    justify-content:center; color:#f6ecda; font-family:var(--serif); font-weight:600; font-size:20px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18);}
  .brand-name{font-family:var(--serif); font-weight:500; font-size:21px; line-height:1;}
  .brand-sub{font-size:11px; color:var(--ink-faint); letter-spacing:.05em; margin-top:3px;}
  .topbar-right{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .who{font-size:11.5px; color:var(--ink-faint);}

  .tabs{display:flex; gap:4px; background:var(--paper-2); border:1px solid var(--line);
        border-radius:100px; padding:4px;}
  .tab{border:0; background:transparent; color:var(--ink-soft); font:inherit; font-size:13px; font-weight:500;
       padding:7px 17px; border-radius:100px; cursor:pointer; transition:.18s; white-space:nowrap;}
  .tab:hover{color:var(--ink);}
  .tab[aria-selected="true"]{background:var(--clay); color:#f8f0e2; font-weight:600; box-shadow:var(--shadow);}

  /* ---------- primitives ---------- */
  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);}
  .pad{padding:18px 20px;}
  .sec-head{display:flex; align-items:baseline; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .sec-head h2{font-family:var(--serif); font-weight:500; font-size:18px; margin:0;}
  .sec-head .hint{font-size:11.5px; color:var(--ink-faint);}
  .sec-head .sp{flex:1;}
  .num{font-variant-numeric:tabular-nums;}
  .unk{color:var(--ink-faint); font-style:italic; font-weight:400;}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:100px;
        font-size:11px; font-weight:500; letter-spacing:.04em; white-space:nowrap;}
  .chip::before{content:""; width:5px; height:5px; border-radius:50%; background:currentColor;}
  .chip.clay{color:var(--clay-deep); background:var(--clay-soft);}
  .chip.pine{color:var(--pine); background:var(--pine-soft);}
  .chip.grey{color:var(--ink-faint); background:var(--paper-2);}
  .chip.plain::before{display:none;}
  .btn{border:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft); font:inherit;
       font-size:12.5px; font-weight:500; padding:7px 14px; border-radius:100px; cursor:pointer; transition:.16s;}
  .btn:hover{color:var(--ink); border-color:var(--clay); background:var(--clay-soft);}
  .btn.primary{background:var(--clay); border-color:var(--clay); color:#f8f0e2; font-weight:600;}
  .btn.primary:hover{background:var(--clay-deep); border-color:var(--clay-deep); color:#fff;}

  select, input[type=number]{font:inherit; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 12px; font-size:13.5px;}
  select:focus, input[type=number]:focus{outline:none; border-color:var(--clay); box-shadow:0 0 0 3px var(--clay-soft);}
  input[type=number]{font-variant-numeric:tabular-nums;}

  /* ---------- control row: month picker + 4 KPIs ---------- */
  .controlrow{display:grid; grid-template-columns:minmax(230px,290px) 1fr; gap:16px; margin-bottom:16px; align-items:stretch;}
  .monthpick{display:flex; flex-direction:column; justify-content:center; gap:9px;}
  .monthpick .lbl{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}
  .monthpick .row{display:flex; gap:8px;}
  .monthpick select{flex:1; min-width:0;}
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  .kpi{display:flex; flex-direction:column; gap:5px; padding:16px 18px;}
  .kpi .ic{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; margin-bottom:3px;}
  .kpi .kl{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint);}
  .kpi .kv{font-family:var(--serif); font-weight:500; font-size:26px; line-height:1.05; letter-spacing:-.01em;}
  .kpi .kn{font-size:11px; color:var(--ink-faint); line-height:1.45;}

  /* ---------- grids ---------- */
  .row-map{display:grid; grid-template-columns:1.62fr 1fr; gap:16px; margin-bottom:16px;}
  .row-three{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px;}
  .stack{display:grid; gap:16px;}

  svg.viz{display:block; width:100%; height:auto; overflow:visible;}
  .ax{font-size:10px; fill:var(--ink-faint);}
  .axt{font-size:10.5px; fill:var(--ink-soft); font-weight:500;}
  .ev-label{font-size:10px; font-weight:600; fill:var(--clay-deep);}
  .ev-node{cursor:grab;} .ev-node:active{cursor:grabbing;}
  .ev-node circle.hit{fill:transparent;}

  /* slider doubles as the x-axis */
  .axis-slider{position:relative; margin-top:2px;}
  input[type=range]{-webkit-appearance:none; appearance:none; background:transparent; width:100%; height:20px;
    cursor:grab; display:block; margin:0;}
  input[type=range]:active{cursor:grabbing;}
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--ink-faint); opacity:.55;}
  input[type=range]::-moz-range-track{height:2px; background:var(--ink-faint); opacity:.55;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    margin-top:-7px; background:var(--clay); border:2.5px solid var(--paper); box-shadow:0 0 0 1px var(--clay), var(--shadow);}
  input[type=range]::-moz-range-thumb{width:13px; height:13px; border-radius:50%;
    background:var(--clay); border:2.5px solid var(--paper); box-shadow:0 0 0 1px var(--clay);}
  .ticks{position:relative; height:26px; margin-top:-2px;}
  .ticks b{position:absolute; transform:translateX(-50%); font-size:10.5px; color:var(--ink-faint);
           font-weight:500; white-space:nowrap; padding-top:7px;}
  .ticks b::before{content:""; position:absolute; left:50%; top:0; width:1px; height:5px; background:var(--line);}
  .horizon{display:flex; gap:3px; background:var(--paper-2); border:1px solid var(--line); border-radius:100px; padding:3px;}
  .horizon button{border:0; background:transparent; color:var(--ink-faint); font:inherit; font-size:11.5px;
    font-weight:500; padding:5px 12px; border-radius:100px; cursor:pointer;}
  .horizon button[aria-pressed="true"]{background:var(--paper); color:var(--ink); box-shadow:var(--shadow); font-weight:600;}

  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft);}
  .legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:-1px;}

  .scenario-bar{display:none; align-items:center; gap:12px; flex-wrap:wrap; background:var(--clay-soft);
    border:1px solid #e7cdb2; border-radius:var(--r-sm); padding:10px 14px; margin-top:12px;
    font-size:12.5px; color:var(--clay-deep);}
  .scenario-bar.on{display:flex;}
  .scenario-bar b{font-weight:600;}

  /* ---------- constellation ---------- */
  .const-wrap{display:grid; grid-template-columns:1.5fr 1fr; gap:18px;}
  .goal-node{cursor:pointer;}
  .goal-node .halo{opacity:0; transition:opacity .25s;}
  .goal-node:hover .halo,.goal-node.sel .halo{opacity:.22;}
  .goal-name{font-size:10.5px; font-weight:600; fill:var(--ink); text-anchor:middle; pointer-events:none;}
  .goal-sub{font-size:9px; fill:var(--ink-soft); text-anchor:middle; pointer-events:none;}
  .orbit{fill:none; stroke:var(--line); stroke-width:1;}
  .orbit-label{font-size:9px; fill:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase;}
  .drow{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13px;}
  .drow:last-child{border-bottom:0;}
  .drow .l{color:var(--ink-soft);} .drow .v{font-weight:600; text-align:right;}
  .meter{height:6px; border-radius:3px; background:var(--paper-2); border:1px solid var(--line); overflow:hidden; margin-top:12px;}
  .meter>i{display:block; height:100%; background:linear-gradient(90deg,var(--clay),var(--caramel)); transition:width .5s cubic-bezier(.4,0,.2,1);}

  /* ---------- ask ---------- */
  .ask-box{position:relative;}
  .ask-input{width:100%; background:var(--paper-2); border:1px solid var(--line); border-radius:100px;
    color:var(--ink); font:inherit; font-size:14.5px; padding:15px 108px 15px 22px; transition:.18s;}
  .ask-input::placeholder{color:var(--ink-faint);}
  .ask-input:focus{outline:none; border-color:var(--clay); background:var(--paper); box-shadow:0 0 0 4px var(--clay-soft);}
  .ask-go{position:absolute; right:7px; top:50%; transform:translateY(-50%);}
  .ask-suggest{display:flex; gap:8px; flex-wrap:wrap; margin-top:11px;}
  .sugg{border:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft); font:inherit;
    font-size:11.5px; padding:6px 12px; border-radius:100px; cursor:pointer;}
  .sugg:hover{color:var(--clay-deep); border-color:var(--clay); background:var(--clay-soft);}
  .options{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px; margin-top:16px;}
  .opt{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:16px 17px;
       display:flex; flex-direction:column; gap:11px; animation:rise .42s cubic-bezier(.22,1,.36,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .opt.previewing{border-color:var(--clay); box-shadow:0 0 0 3px var(--clay-soft);}
  .opt .o-title{font-family:var(--serif); font-size:15px; font-weight:500; line-height:1.25;}
  .opt .o-why{font-size:12.5px; color:var(--ink-soft); line-height:1.55;}
  .impact{display:grid; gap:7px;}
  .imp-row{display:grid; grid-template-columns:78px 1fr auto; align-items:center; gap:9px; font-size:11px;}
  .imp-row .il{color:var(--ink-faint);}
  .imp-bar{height:4px; border-radius:2px; background:var(--line-soft); position:relative; overflow:hidden;}
  .imp-bar>i{position:absolute; top:0; bottom:0; border-radius:2px;}
  .imp-row .iv{font-weight:600; font-variant-numeric:tabular-nums;}
  .tradeoff{font-size:11.5px; color:var(--clay-deep); line-height:1.5; display:flex; gap:7px;}
  .tradeoff span:first-child{flex:none; font-weight:600;}
  .o-foot{margin-top:auto; display:flex; gap:8px;}

  /* ---------- fill in what's missing ---------- */
  .fill-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:13px;}
  .fill-f{display:flex; flex-direction:column; gap:6px;}
  .fill-f label{font-size:11.5px; color:var(--ink-soft); font-weight:500;}
  .fill-f .wrapin{position:relative; display:flex; align-items:center;}
  .fill-f .cur{position:absolute; left:12px; font-size:12.5px; color:var(--ink-faint); pointer-events:none;}
  .fill-f input{width:100%; padding-left:34px;}
  .fill-f input.set{border-color:var(--pine); background:var(--pine-soft);}
  .subhead{font-family:var(--serif); font-size:15px; font-weight:500; margin:20px 0 11px; padding-top:16px;
           border-top:1px solid var(--line-soft);}

  /* ---------- brief ---------- */
  .bitem{display:grid; grid-template-columns:24px 1fr; gap:13px; padding:14px 0; border-bottom:1px solid var(--line-soft);}
  .bitem:last-child{border-bottom:0;}
  .bi{width:24px; height:24px; border-radius:8px; display:grid; place-items:center; font-size:12px; font-weight:600;}
  .bt{font-weight:600; font-size:14px; margin-bottom:3px;}
  .bd{font-size:13px; color:var(--ink-soft); line-height:1.6;}
  .bd b{color:var(--ink); font-weight:600;}

  /* ---------- ledger ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--line-soft);}
  th{color:var(--ink-faint); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:.08em;}
  td.r{text-align:right; font-variant-numeric:tabular-nums;}
  .lst{list-style:none; padding:0; margin:0;}
  .lst li{padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13px; color:var(--ink-soft);
          display:flex; justify-content:space-between; gap:16px;}
  .lst li:last-child{border-bottom:0;}
  .lst li>span:first-child{color:var(--ink); font-weight:500; flex:none;}
  .lst li>span:last-child{text-align:right;}

  .integrity{display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:11.5px;
    color:var(--ink-faint); background:var(--paper-2); border:1px solid var(--line);
    border-radius:100px; padding:8px 16px; margin-bottom:16px;}
  .integrity .go{color:var(--clay-deep); cursor:pointer; font-weight:500; border-bottom:1px dashed var(--caramel);}

  .empty{display:grid; place-items:center; text-align:center; padding:38px 20px; color:var(--ink-faint);
    font-size:13px; line-height:1.7;}
  .empty .big{font-family:var(--serif); font-size:19px; color:var(--ink-soft); margin-bottom:6px;}

  .view{display:none;} .view.on{display:block; animation:fade .3s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .foot{text-align:center; color:var(--ink-faint); font-size:11.5px; margin-top:28px; line-height:1.7;}

  .tip{position:fixed; pointer-events:none; z-index:90; opacity:0; transition:opacity .13s;
    background:var(--ink); color:#f6ecda; border-radius:9px; padding:9px 12px; font-size:11.5px;
    line-height:1.55; max-width:262px; box-shadow:var(--shadow-lg);}
  .tip.on{opacity:1;}
  .tip .tt{font-weight:600; margin-bottom:3px;}
  .tip .td{opacity:.8;}

  @media (max-width:1180px){
    .row-map{grid-template-columns:1fr;} .row-three{grid-template-columns:1fr;}
    .const-wrap{grid-template-columns:1fr;}
    .controlrow{grid-template-columns:1fr;} .kpis{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:620px){ .kpis{grid-template-columns:1fr;} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
</style>
</head>
<body>

<!-- ============ GATE ============ -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark">Steven</div>
    <h1 class="gate-title">Finance Intern</h1>
    <div class="gate-sub">Enter your passcode to continue.</div>
    <div class="pin" id="pin"><i></i><i></i><i></i><i></i></div>
    <button class="enter" id="enterBtn">Enter</button>
    <div class="gate-lock" id="gateLock">🔒 Private</div>
  </div>
</div>

<div class="app" id="app">
  <div class="wrap" id="root"><div class="card pad">Loading…</div></div>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";
/* ==================================================================
   0. HELPERS
   ================================================================== */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function money(str){
  if(str==null) return null;
  if(typeof str==="number") return isFinite(str)?str:null;
  const m=String(str).replace(/,/g,"").match(/-?\$?\s*(\d+(?:\.\d+)?)/);
  if(!m) return null; const n=parseFloat(m[1]); return isFinite(n)?n:null;
}
const MONTHS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONFULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const mi=(y,m)=>y*12+m, miY=i=>Math.floor(i/12), miM=i=>((i%12)+12)%12;
const miLabel=i=>MON[miM(i)]+" "+String(miY(i)).slice(2);
const miLong =i=>MON[miM(i)]+" "+miY(i);

function parseWhen(str){
  if(!str) return null; const s=String(str).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{2})/)))            return mi(+m[1],+m[2]-1);
  if((m=s.match(/\bQ([1-4])\s*(\d{4})\b/i)))     return mi(+m[2],(+m[1]-1)*3);
  if((m=s.match(/\b([A-Za-z]{3})[a-z]*[-\s](\d{2,4})\b/))){
    const i=MONTHS.indexOf(m[1].toLowerCase());
    if(i>=0){let y=+m[2]; if(y<100)y+=2000; return mi(y,i);}
  }
  return null;
}
const fmt=(n,o)=>{
  o=o||{};
  if(n==null||!isFinite(n)) return "—";
  const sign=n<0?"−":(o.signed&&n>0?"+":""), a=Math.abs(n);
  if(o.compact&&a>=1000){const k=a/1000; return sign+"$"+(k>=100?Math.round(k):k.toFixed(k>=10?0:1))+"k";}
  return sign+"$"+(o.cents? a.toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2})
                          : Math.round(a).toLocaleString("en-SG"));
};

/* ==================================================================
   1. MODEL — strictly from data/finance.json
   ================================================================== */
const M={raw:null,today:0,goals:[],events:[],recurring:[],income:{},unknowns:[],conflicts:[],
         months:[],expenseCats:[],incomeCats:null,liabilities:[],balanceFields:[]};

function buildModel(d){
  M.raw=d;
  const A=d.actuals||{};
  M.months=(A.months||[]).map(r=>({key:r.m, idx:parseWhen(r.m), income:r.income, expense:r.expense,
                                   cashFlow:r.cashFlow, partial:!!r.partial}));
  // "today" = latest month present in the actuals, else the report period
  M.today = M.months.length ? M.months[M.months.length-1].idx
          : (parseWhen(d.period?.generatedAt) ?? parseWhen(d.period?.label) ?? mi(2026,7));

  const t=d.salary?.total||{};
  M.income={gross:money(t.gross), cpf:money(t.cpf), takeHome:money(t.takeHome),
            people:(d.salary?.rows||[]).map(r=>({name:r.name,gross:money(r.gross),cpf:money(r.cpf),takeHome:money(r.takeHome)})),
            source:d.salary?.source, note:d.salary?.note};

  M.expenseCats=(A.expenseByCategory?.rows||[]).filter(r=>r.amount>0)
                 .sort((a,b)=>b.amount-a.amount);
  M.expenseCatsMonth=A.expenseByCategory?.month||null;
  M.incomeCats=A.incomeByCategory||null;
  M.yearTotals=A.yearTotals||null;

  M.recurring=(d.bills?.items||[]).map(b=>{
    const txt=String(b.detail||"");
    const perMo=txt.match(/\$\s?([\d,]+(?:\.\d+)?)\s*\/\s*mo/i), perYr=txt.match(/\$\s?([\d,]+(?:\.\d+)?)\s*\/\s*yr/i);
    const monthly=perMo?money(perMo[0]):null, annual=perYr?money(perYr[0]):null;
    const starts=parseWhen(txt), notYet=/not yet active|starts/i.test(txt);
    return {name:b.name, detail:b.detail, monthly, annual, starts,
            active:!!(monthly||annual)&&!notYet, unmodelled:!monthly&&!annual, conflict:/conflict|⚠/i.test(txt)};
  });

  M.liabilities=(d.liabilities?.rows||[]).map(r=>Object.assign({},r,{
    startsIdx:parseWhen(r.startsOn), repayIdx:parseWhen(r.repayStarts)}));

  M.balanceFields=(d.balances?.fields||[]).map(f=>Object.assign({},f));

  // goals
  M.goals=(d.savingsGoals?.rows||[]).map((g,i)=>{
    const total=money(g.totalCost), when=parseWhen(g.target), monthly=money(g.monthly);
    // the $33k School Fees goal IS the School Loan liability — modelled there, not twice
    const isLoanMirror=(M.liabilities||[]).some(l=>!l.placeholder&&l.principal===total&&/loan/i.test(l.name)&&/school|education/i.test(g.goal));
    return {id:"g"+i, name:g.goal, targetLabel:g.target, target:when, total, monthly,
            status:g.status, tone:g.tone||"grey", ongoing:when==null, mirrorsLiability:isLoanMirror,
            conflict:/\*/.test(String(g.totalCost||""))};
  });

  M.events=[];
  M.goals.forEach(g=>{
    if(g.target==null||g.total==null) return;
    M.events.push({id:"e_"+g.id, goalId:g.id, name:g.name, amount:g.total, month:g.target,
      baseMonth:g.target, kind:"goal", overdue:g.target<M.today, conflict:g.conflict,
      excluded:g.mirrorsLiability});
  });
  M.liabilities.forEach(l=>{ if(l.startsIdx!=null)
    M.events.push({id:"el_"+l.key, name:l.name, amount:null, month:l.startsIdx, baseMonth:l.startsIdx,
                   kind:"marker", note:l.note}); });
  const goalNames=new Set(M.goals.map(g=>g.name.toLowerCase()));
  M.recurring.forEach((b,i)=>{
    if(goalNames.has(String(b.name).toLowerCase())){
      const ev=M.events.find(e=>e.name.toLowerCase()===String(b.name).toLowerCase());
      if(ev){ev.altDate=b.starts; if(b.conflict) ev.conflict=true;} return;
    }
    if(b.unmodelled&&b.starts!=null&&!M.events.some(e=>e.name===b.name))
      M.events.push({id:"eb"+i,name:b.name,amount:null,month:b.starts,baseMonth:b.starts,kind:"marker",note:b.detail});
  });
  M.events.sort((a,b)=>a.month-b.month);

  M.conflicts=[];
  if(d.conflicts) Object.keys(d.conflicts).forEach(k=>M.conflicts.push(Object.assign({key:k},d.conflicts[k])));

  M.unknowns=[];
  if(!M.expenseCats.length) M.unknowns.push({k:"cats",label:"Expense categories"});
  return M;
}

/* ---- derived: balances, liabilities, net worth ---- */
function balVal(key){
  if(S.balances[key]!=null) return S.balances[key];
  const f=M.balanceFields.find(x=>x.key===key);
  return f && f.value!=null ? f.value : null;
}
const anyBalanceSet = ()=> M.balanceFields.some(f=>balVal(f.key)!=null);
function assetsAt(){ // assets don't move with the model — they're a stated balance
  let sum=0, known=false;
  M.balanceFields.forEach(f=>{const v=balVal(f.key); if(v!=null){sum+=v; known=true;}});
  return known?sum:null;
}
/** Outstanding liability at absolute month `mIdx`. */
function liabilityAt(l,mIdx){
  if(l.placeholder) return null;
  if(l.startsIdx!=null && mIdx<l.startsIdx) return 0;          // not drawn yet
  let out = l.outstanding!=null?l.outstanding:(l.principal||0);
  if(l.startsIdx!=null && mIdx>=l.startsIdx) out=l.principal||0;
  if(l.repayMonthly && l.repayIdx!=null && mIdx>=l.repayIdx)
    out=Math.max(0,out-l.repayMonthly*(mIdx-l.repayIdx+1));
  return out;
}
/** Total owed at `mIdx` — every liability, for the liabilities chart. */
const liabilitiesAt = mIdx => M.liabilities.reduce((a,l)=>a+(liabilityAt(l,mIdx)||0),0);
/** Only the liabilities that belong in net worth. The mortgage is flagged out in
 *  finance.json: it buys a property whose value isn't recorded, so subtracting the
 *  debt alone would render a collapse that isn't real. */
const liabilitiesNW = mIdx => M.liabilities.reduce(
  (a,l)=> a + (l.countsInNetWorth===false ? 0 : (liabilityAt(l,mIdx)||0)), 0);
function goalFunded(gid){
  if(S.funded[gid]!=null) return S.funded[gid];
  return null;                                    // never assume 0 is a recorded fact
}

/* ---- income / expense basis for the projection ---- */
function basis(){
  const c=(M.raw.conflicts||{}).incomeBasis;
  const opt=(c?.options||[]).find(o=>o.key===S.basis);
  if(S.basis==="actual"){
    const last3=M.months.filter(m=>!m.partial).slice(-3);
    const inc=last3.length? last3.reduce((a,m)=>a+m.income,0)/last3.length : (opt?.monthlyIncome??0);
    const exp=last3.length? last3.reduce((a,m)=>a+m.expense,0)/last3.length : (opt?.monthlyExpense??0);
    return {income:inc, expense:exp, label:"3-month actual average"};
  }
  return {income:opt?.monthlyIncome??0, expense:M.yearTotals?.avgExpense??0, label:"Monthly Budget assumption"};
}

/** Net-worth projection, month by month. */
function project(scn){
  const s=scn||S, B=basis(), rows=[];
  const a0=assetsAt();
  const openAssets=a0==null?0:a0;
  const net=B.income-B.expense;
  let assets=openAssets;
  for(let k=0;k<=s.horizon;k++){
    const month=M.today+k;
    if(k>0){
      assets+=net;
      // loan repayments leave cash but also cut the liability → net worth neutral
      M.liabilities.forEach(l=>{ if(l.repayMonthly&&l.repayIdx!=null&&month>=l.repayIdx&&liabilityAt(l,month-1)>0)
        assets-=l.repayMonthly; });
    }
    const hits=[];
    M.events.forEach(e=>{
      if(e.kind!=="goal"||e.excluded) return;
      const w=s.shifts[e.id]!=null?s.shifts[e.id]:e.month;
      const due=Math.max(w,M.today);
      if(due===month){ const amt=s.overrides[e.id]!=null?s.overrides[e.id]:e.amount;
        assets-=amt; hits.push({name:e.name,amount:amt,id:e.id}); }
    });
    if(s.preview&&s.preview.month===month){ assets-=s.preview.amount;
      hits.push({name:s.preview.label,amount:s.preview.amount,preview:true}); }
    rows.push({k,month,assets,liab:liabilitiesAt(month),nw:assets-liabilitiesNW(month),hits});
  }
  return {rows,net,B};
}
const cloneScn=o=>Object.assign({},S,{shifts:Object.assign({},S.shifts),overrides:Object.assign({},S.overrides)},o||{});

/* ==================================================================
   5. CASH MAP — net worth over time; the slider is the x-axis
   ================================================================== */
const CH={w:1000,h:300,pad:{l:58,r:22,t:52,b:12}};

function renderMap(){
  $("#p-map").innerHTML=`
    <div class="sec-head">
      <span class="hint">Net worth · drag a milestone to test a different date</span>

function drawChart(){
  const svg=$("#chart"); if(!svg) return;
  const pr=project(), rows=pr.rows;
  const ghost=S.preview? project(cloneScn({preview:null})).rows : null;
  const known=assetsAt()!=null;

  const all=rows.map(r=>r.nw).concat(ghost?ghost.map(r=>r.nw):[]);
  let lo=Math.min(0,...all), hi=Math.max(0,...all);
  if(lo===hi){lo-=1000;hi+=1000;}
  const p=(hi-lo)*.18; lo-=p; hi+=p;

  const X=k=>CH.pad.l+(k/S.horizon)*(CH.w-CH.pad.l-CH.pad.r);
  const Y=v=>CH.pad.t+(1-(v-lo)/(hi-lo))*(CH.h-CH.pad.t-CH.pad.b);
  const line=rs=>rs.map((r,i)=>(i?"L":"M")+X(r.k).toFixed(1)+" "+Y(r.nw).toFixed(1)).join(" ");
  const area=rs=>line(rs)+` L ${X(S.horizon).toFixed(1)} ${Y(lo).toFixed(1)} L ${X(0).toFixed(1)} ${Y(lo).toFixed(1)} Z`;

  // y gridlines + labels (net worth)
  let grid="";
  for(let i=0;i<=4;i++){
    const v=lo+(hi-lo)*(i/4), y=Y(v);
    grid+=`<line x1="${CH.pad.l}" y1="${y}" x2="${CH.w-CH.pad.r}" y2="${y}" stroke="var(--line)" ${v===0?'stroke-dasharray="none"':'stroke-dasharray="2 5"'}/>
           <text class="ax" x="${CH.pad.l-8}" y="${y+3.5}" text-anchor="end">${fmt(v,{compact:true})}</text>`;
  }
  const zeroY=(0>=lo&&0<=hi)?Y(0):null;

  // milestone nodes with staggered labels
  const placed=M.events.map(e=>({e,k:Math.max(S.shifts[e.id]!=null?S.shifts[e.id]:e.month,M.today)-M.today}))
    .filter(p=>p.k>=0&&p.k<=S.horizon).sort((a,b)=>a.k-b.k);
  let lastX=-999,lastRow=1;
  placed.forEach(p=>{const x=X(p.k); p.row=(x-lastX<95)?(lastRow===0?1:0):0; lastX=x; lastRow=p.row;});
  const rowOf=new Map(placed.map(p=>[p.e.id,p.row]));

  const nodes=M.events.map(e=>{
    const w=Math.max(S.shifts[e.id]!=null?S.shifts[e.id]:e.month,M.today), k=w-M.today;
    if(k<0||k>S.horizon) return "";
    const marker=e.kind==="marker"||e.excluded;
    const amt=S.overrides[e.id]!=null?S.overrides[e.id]:e.amount;
    const y=marker?CH.pad.t-2:Y(rows[k].nw);
    const col=marker?"var(--ink-faint)":(S.shifts[e.id]!=null?"var(--pine)":"var(--clay)");
    const r=marker?3.5:clamp(4+Math.sqrt((amt||0)/70000)*7,5,12);
    const ly=CH.pad.t-24-(rowOf.get(e.id)||0)*15;
    const anchor=X(k)<CH.pad.l+55?"start":(X(k)>CH.w-CH.pad.r-55?"end":"middle");
    return `<g class="ev-node" data-ev="${esc(e.id)}" data-marker="${marker}">
      <line x1="${X(k)}" y1="${ly+4}" x2="${X(k)}" y2="${CH.h-CH.pad.b}" stroke="${col}" stroke-opacity=".45" stroke-dasharray="3 4"/>
      <circle class="hit" cx="${X(k)}" cy="${y}" r="19"/>
      <circle cx="${X(k)}" cy="${y}" r="${r}" fill="var(--paper)" stroke="${col}" stroke-width="2"/>
      ${marker?"":`<circle cx="${X(k)}" cy="${y}" r="${r*.4}" fill="${col}"/>`}
      <text class="ev-label" x="${X(k)}" y="${ly}" text-anchor="${anchor}" fill="${col}">${esc(e.name)}${e.conflict?" ⚠":""}</text>
    </g>`;}).join("");

  svg.innerHTML=`
    <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--pine)" stop-opacity=".34"/>
      <stop offset="100%" stop-color="var(--pine)" stop-opacity=".03"/></linearGradient></defs>
    ${grid}
    ${zeroY!=null?`<line x1="${CH.pad.l}" y1="${zeroY}" x2="${CH.w-CH.pad.r}" y2="${zeroY}" stroke="var(--ink-faint)"/>`:""}
    <text class="axt" x="${CH.pad.l-8}" y="${CH.pad.t-32}" text-anchor="end" style="font-size:9.5px;letter-spacing:.08em">NET WORTH</text>
    ${ghost?`<path d="${line(ghost)}" fill="none" stroke="var(--ink-faint)" stroke-width="1.4" stroke-dasharray="4 4"/>`:""}
    <path d="${area(rows)}" fill="url(#gA)"/>
    <path d="${line(rows)}" fill="none" stroke="var(--pine)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"
          ${known?"":'stroke-dasharray="6 4" opacity=".75"'}/>
    <line x1="${X(S.cursor)}" y1="${CH.pad.t-28}" x2="${X(S.cursor)}" y2="${CH.h-CH.pad.b}" stroke="var(--clay-deep)" stroke-opacity=".5"/>
    <circle cx="${X(S.cursor)}" cy="${Y(rows[S.cursor].nw)}" r="5" fill="var(--clay)" stroke="var(--paper)" stroke-width="2.5"/>
    ${nodes}`;

  drawTicks();
  wireChart(svg,X);

  const row=rows[S.cursor];
  $("#map-read").innerHTML=`
    <div style="display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px">
      <div><div style="font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)">${S.cursor?"Projected":"Today"}</div>
        <div style="font-family:var(--serif);font-size:25px;line-height:1.1">${S.cursor?miLong(row.month):miLong(M.today)}</div></div>
      <div><div style="font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)">Net worth</div>
        <div class="num" style="font-family:var(--serif);font-size:25px;line-height:1.1;color:${row.nw<0?"var(--clay-deep)":"var(--pine-deep)"}">

/** Tick labels under the slider, every 6 months — the slider is the x-axis. */
function drawTicks(){
  const host=$("#ticks"); if(!host) return;
  const pct=k=>{
    // range input thumb travel is inset by half a thumb at each end
    const thumb=16, w=host.clientWidth||1;
    const frac=k/S.horizon;
    return ((thumb/2 + frac*(w-thumb))/w)*100;
  };
  let out="";
  for(let k=0;k<=S.horizon;k+=6) out+=`<b style="left:${pct(k).toFixed(2)}%">${miLabel(M.today+k)}</b>`;
  if(S.horizon%6!==0) out+=`<b style="left:${pct(S.horizon).toFixed(2)}%">${miLabel(M.today+S.horizon)}</b>`;
  host.innerHTML=out;
}

function wireChart(svg,X){
  const tip=$("#tip");
  const toK=cx=>{const b=svg.getBoundingClientRect();
    const vx=((cx-b.left)/b.width)*CH.w;
    return clamp(Math.round(((vx-CH.pad.l)/(CH.w-CH.pad.l-CH.pad.r))*S.horizon),0,S.horizon);};

  $$(".ev-node",svg).forEach(node=>{
    const id=node.dataset.ev, e=M.events.find(x=>x.id===id), marker=node.dataset.marker==="true";
    node.addEventListener("mousemove",ev=>{
      const w=S.shifts[id]!=null?S.shifts[id]:e.month;
      const amt=S.overrides[id]!=null?S.overrides[id]:e.amount;
      tip.className="tip on";
      tip.innerHTML=`<div class="tt">${esc(e.name)}</div><div class="td">
        ${amt!=null?fmt(amt)+" · ":""}${miLong(Math.max(w,M.today))}
        ${e.excluded?"<br>counted as the School Loan liability, not a second cash call":""}
        ${e.overdue&&!e.excluded?"<br>target date already passed":""}
        ${e.conflict?"<br>figure conflicts between sources":""}
        ${e.note?"<br>"+esc(e.note):""}
        ${marker?"":"<br>drag to test a different date"}</div>`;
      tip.style.left=Math.min(ev.clientX+14,innerWidth-280)+"px";
      tip.style.top=(ev.clientY-12)+"px";
    });
    node.addEventListener("mouseleave",()=>tip.className="tip");
    if(marker) return;
    node.addEventListener("pointerdown",ev=>{
      ev.preventDefault();
      try{node.setPointerCapture(ev.pointerId);}catch(_){}
      const move=m=>{S.shifts[id]=M.today+toK(m.clientX); refresh();};
      const up=()=>{node.removeEventListener("pointermove",move); node.removeEventListener("pointerup",up);
        if(S.shifts[id]===e.baseMonth) delete S.shifts[id]; refresh();};
      node.addEventListener("pointermove",move); node.addEventListener("pointerup",up);
    });
  });
  svg.addEventListener("click",ev=>{
    if(ev.target.closest(".ev-node")) return;
    S.cursor=toK(ev.clientX); const sl=$("#slider"); if(sl) sl.value=S.cursor; refresh();
  });
}

function renderScenarioBar(){
  const bar=$("#scenario-bar"); if(!bar) return;

    .concat(S.preview?[`previewing <b>${esc(S.preview.label)}</b>`]:[]);

   7. DONUTS + EXPENSE RANKING
   ================================================================== */
function donut(items,total,centerLabel,centerSub){
  const W=250,H=190,cx=95,cy=95,R=66,r=42;
  if(!items.length) return null;
  let a0=-Math.PI/2, segs="";
  items.forEach((it,i)=>{
    const frac=total>0?it.value/total:0, a1=a0+frac*Math.PI*2;
    // a single 100% slice is a full circle: an arc whose start and end points
    // coincide draws nothing, so render it as a stroked ring instead.
    if(frac>=0.9999){
      segs+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--c${(i%6)+1})"
              stroke-width="${R-r}" opacity=".92"><title>${esc(it.name)} ${fmt(it.value)} (100%)</title></circle>`;
      a0=a1; return;
    }
    const big=(a1-a0)>Math.PI?1:0;
    const p=(rad,a)=>[cx+Math.cos(a)*rad,cy+Math.sin(a)*rad];
    const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);
    segs+=`<path d="M${x0} ${y0} A${R} ${R} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${big} 0 ${x3} ${y3} Z"
            fill="var(--c${(i%6)+1})" opacity=".92"><title>${esc(it.name)} ${fmt(it.value)} (${(frac*100).toFixed(1)}%)</title></path>`;
    a0=a1;
  });
  const legend=items.map((it,i)=>`
    <div style="display:flex;align-items:center;gap:7px;font-size:11.5px;padding:2.5px 0">
      <i style="width:9px;height:9px;border-radius:3px;background:var(--c${(i%6)+1});flex:none"></i>
      <span style="flex:1;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</span>
      <b class="num" style="font-weight:600">${fmt(it.value,{compact:true})}</b>
      <span style="color:var(--ink-faint);width:38px;text-align:right">${total>0?(it.value/total*100).toFixed(0):0}%</span>
    </div>`).join("");
  return `<div style="display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center">
      <svg class="viz" style="width:190px" viewBox="0 0 ${W} ${H}">
        ${segs}
        <text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-family:var(--serif);font-size:17px;fill:var(--ink)">${centerLabel}</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" class="ax">${esc(centerSub)}</text>
      </svg>
      <div>${legend}</div></div>`;
}

function renderAsk(){

    </div>
    <div class="ask-suggest" id="sugg"></div>
    <div class="options" id="ask-out"></div>`;
  const sg=["I have $5,000 available. What should I do with it?","Can I afford a $4,000 trip?",
            "What happens if renovation costs $10k more?","What can I deploy this month?"];
  $("#sugg").innerHTML=sg.map(s=>`<button class="sugg">${esc(s)}</button>`).join("");
  $$("#sugg .sugg").forEach(b=>b.onclick=()=>{$("#ask").value=b.textContent; ask();});
  $("#ask-go").onclick=ask;
  $("#ask").onkeydown=e=>{if(e.key==="Enter") ask();};

function parseAsk(q){
  const s=q.toLowerCase();
  const m=s.replace(/,/g,"").match(/\$?\s*(\d+(?:\.\d+)?)\s*(k\b)?/);
  let amount=m?parseFloat(m[1])*(m[2]?1000:1):null;
  if(amount!=null&&amount<100&&!/\bk\b/.test(s)) amount=null;
  const goal=M.goals.find(g=>s.includes(g.name.toLowerCase()));
  if(/afford|trip|holiday|buy|spend/.test(s))            return {kind:"afford",amount,goal};
  if(/costs? more|more expensive|overrun|goes up/.test(s)) return {kind:"overrun",amount,goal};
  return {kind:"deploy",amount,goal};
}
function deployable(){
  const pr=project(), B=pr.B;
  let claim=0, overdueNow=0;
  M.goals.forEach(g=>{
    if(g.total==null||g.mirrorsLiability) return;
    const f=goalFunded(g.id)||0, need=Math.max(0,g.total-f);
    if(g.target!=null&&g.target<=M.today){overdueNow+=need; return;}
    const left=g.target==null?Math.max(S.horizon,12):Math.max(1,g.target-M.today);
    claim+=need/left;
  });
  return {net:pr.net,claim,overdueNow,free:pr.net-claim,pr,B};
}
function ask(){const q=$("#ask").value.trim(); if(!q) return; renderAskResults(buildOptions(parseAsk(q),q));}

function buildOptions(intent,q){
  const D=deployable(), amt=intent.amount, opts=[];
  const mk=(title,why,impacts,tradeoff,preview)=>opts.push({title,why,impacts,tradeoff,preview});
  const soonest=M.goals.filter(g=>g.target!=null&&!g.mirrorsLiability).sort((a,b)=>a.target-b.target)[0];
  const biggest=M.goals.slice().sort((a,b)=>(b.total||0)-(a.total||0))[0];
  const burn=D.net<0;

  if(intent.kind==="afford"&&amt){
    const months=D.net>0?amt/D.net:null;
    mk(burn?"You can't fund this from income":"Spread it over "+Math.ceil(months)+" month"+(Math.ceil(months)===1?"":"s"),
      burn? `Your last three months average <b>${fmt(D.B.income)}</b> in and <b>${fmt(D.B.expense)}</b> out — you are running <b>${fmt(Math.abs(D.net))}/month negative</b>. ${fmt(amt)} cannot come from surplus because there isn't one; it comes out of savings.`
          : `${fmt(amt)} is ${(months).toFixed(1)}× your monthly net of ${fmt(D.net)}. Spreading it keeps every goal date intact.`,
      [["Net worth",-amt,"bad"],["Goals",0,"neutral"],["Liquidity",-amt,"bad"],["Timeline",0,"neutral"]],
      burn? "Every month at this run-rate already costs you "+fmt(Math.abs(D.net))+" before this trip." : null,
      {label:q.slice(0,22),amount:amt,month:M.today});
    mk("Take it now, in one hit",
      `Net worth drops by ${fmt(amt)} the month you pay and never recovers the gap — it shifts every later point down.`,
      [["Net worth",-amt,"bad"],["Goals",0,"neutral"],["Liquidity",-amt,"bad"],["Timeline",0,"neutral"]],
      assetsAt()==null?"You cannot verify this is affordable — no cash balance is entered.":null,
      {label:q.slice(0,22),amount:amt,month:M.today});
    if(soonest) mk(`Don't — ${soonest.name} lands first`,
      `${soonest.name} needs ${fmt(soonest.total)} by ${soonest.targetLabel}, with ${goalFunded(soonest.id)!=null?fmt(goalFunded(soonest.id))+" funded":"nothing recorded as funded"}. That claim outranks a discretionary trip.`,
      [["Net worth",0,"good"],["Goals",amt,"good"],["Liquidity",0,"good"],["Timeline",0,"neutral"]],
      "Defers the spend with no date at which it becomes affordable on current run-rate.",null);
  }
  else if(intent.kind==="overrun"){
    const g=intent.goal||M.goals.find(x=>/renovation/i.test(x.name))||biggest;
    const bump=amt||10000, e=M.events.find(x=>x.goalId===g?.id);
    mk("Absorb it",
      `${g?.name} rises from ${fmt(g?.total)} to ${fmt((g?.total||0)+bump)}. At ${fmt(D.net,{signed:true})}/month you ${D.net>0?"need "+Math.ceil(bump/D.net)+" extra months of saving":"have no surplus to absorb it from — it comes straight off net worth"}.`,
      [["Net worth",-bump,"bad"],["Goals",-bump,"warn"],["Liquidity",-bump,"warn"],["Timeline",-bump,"warn"]],
      `Only works if those months exist before ${esc(g?.targetLabel||"the deadline")}.`,
      e?{label:g.name+" +"+fmt(bump,{compact:true}),amount:bump,month:Math.max(e.month,M.today)}:null);
    mk("Push the date",
      `Hold the amount and move ${g?.name} later. Drag its milestone on the map to see how far it has to slide.`,
      [["Net worth",0,"good"],["Goals",0,"neutral"],["Liquidity",0,"good"],["Timeline",-bump,"bad"]],
      `${g?.name} then collides with whatever already sits in that window.`,null);
    mk("Trim another goal",
      `${biggest?.name} is the largest claim at ${fmt(biggest?.total)}. Cutting it by ${fmt(bump)} covers the overrun with no date changing.`,
      [["Net worth",0,"neutral"],["Goals",-bump,"warn"],["Liquidity",0,"neutral"],["Timeline",0,"good"]],
      `Trades a firm commitment for an estimate — ${esc(g?.name||"")} is still "est." in your data.`,null);
  }
  else{
    const a=amt||Math.max(D.free,0);
    if(burn) mk("Fix the run-rate before deploying anything",
      `Six of the last seven months are cash-flow negative, ${fmt(M.yearTotals?.cashFlow)} year-to-date. Deploying ${fmt(a)} while ${fmt(Math.abs(D.net))}/month leaks is refilling a bucket with a hole in it.`,
      [["Net worth",0,"good"],["Goals",0,"neutral"],["Liquidity",a,"good"],["Timeline",0,"neutral"]],
      `Costs a month of progress on goals that are already behind.`,null);
    const top=M.expenseCats[0];
    if(top) mk(`Cut ${top.name} first`,
      `${top.name} was ${fmt(top.amount)} in ${MONFULL[miM(parseWhen(M.expenseCatsMonth))]} — ${(top.amount/M.expenseCats.reduce((x,r)=>x+r.amount,0)*100).toFixed(0)}% of the month. Halving it alone would swing you ${fmt(top.amount/2,{signed:true})}/month.`,
      [["Net worth",top.amount/2,"good"],["Goals",top.amount/2,"good"],["Liquidity",top.amount/2,"good"],["Timeline",0,"neutral"]],
      `One month is not a trend — check whether ${top.name} repeats before cutting structurally.`,null);
    const ef=M.goals.find(g=>/emergency/i.test(g.name));
    if(ef) mk(`Top up ${ef.name}`,
      `${ef.name} targets ${fmt(ef.total)} with ${goalFunded(ef.id)!=null?fmt(goalFunded(ef.id))+" recorded":"nothing recorded"}. Until it exists, a negative run-rate has nothing to land on.`,
      [["Net worth",0,"neutral"],["Goals",Math.min(a,ef.total||a),"good"],["Liquidity",Math.min(a,ef.total||a),"good"],["Timeline",0,"neutral"]],
      `Emergency cash earns the least — but it's the only goal with no deadline to trade against.`,
      {label:ef.name,amount:Math.min(a,ef.total||a),month:M.today});
  }
  return opts.slice(0,3);
}

function renderAskResults(opts){
  const out=$("#ask-out"); if(!out) return;
  if(!opts){out.innerHTML=""; return;}
  const maxAbs=Math.max(...opts.flatMap(o=>o.impacts.map(i=>Math.abs(i[1]))),1);
  const COL={good:"var(--pine)",warn:"var(--caramel)",bad:"var(--clay)",neutral:"var(--line)"};
  out.innerHTML=opts.map((o,i)=>`
    <div class="opt" data-opt="${i}" style="animation-delay:${i*80}ms">

function briefItems(){
  const D=deployable(), out=[];
  const push=(tone,icon,title,desc)=>out.push({tone,icon,title,desc});
  const T={clay:"var(--clay)",pine:"var(--pine)",grey:"var(--ink-faint)"};

  // 1. the deployable / run-rate sentence
  if(D.net<0){
    push("clay","!","You are spending more than you earn",
      `Across the last three actual months you took in <b>${fmt(D.B.income)}</b> and spent <b>${fmt(D.B.expense)}</b> — a run-rate of <b>${fmt(D.net)}/month</b>. Year to date that is <b>${fmt(M.yearTotals?.cashFlow)}</b>. Nothing is deployable this month; the question is which expense line comes down.`);
  }else{
    push("pine","$","Deployable this month",
      `Roughly <b>${fmt(D.free)}</b> is deployable without touching a funded goal — ${fmt(D.net)} net less the ${fmt(D.claim)}/month your dated goals need.`);
  }

  // 2. biggest expense line
  const top=M.expenseCats[0];
  if(top){
    const tot=M.expenseCats.reduce((a,r)=>a+r.amount,0);
    push("clay","▲",`${top.name} is the decision`,
      `<b>${fmt(top.amount)}</b> of ${MONFULL[miM(parseWhen(M.expenseCatsMonth))]}'s ${fmt(tot)} — <b>${(top.amount/tot*100).toFixed(0)}%</b> of everything you spent. Every other category combined is ${fmt(tot-top.amount)}. If one number moves this month, it is this one.`);
  }

  // 3. trend
  const nonPartial=M.months.filter(m=>!m.partial);
  const neg=nonPartial.filter(m=>m.cashFlow<0).length;
  if(nonPartial.length>=3)
    push("clay","⌁","The trend, not the month",
      `${neg} of the last ${nonPartial.length} months are cash-flow negative, and the last three are the worst three: ${nonPartial.slice(-3).map(m=>MON[miM(m.idx)]+" "+fmt(m.cashFlow,{signed:true,compact:true})).join(", ")}. Income fell from ${fmt(nonPartial[0].income)} in ${MON[miM(nonPartial[0].idx)]} to ${fmt(nonPartial[nonPartial.length-1].income)} while expenses rose.`);

  // 4. conflicts — decisions, not warnings
  M.conflicts.forEach(c=>push("clay","?",`Reconcile: ${c.title.toLowerCase()}`,
    esc(c.detail)+(c.key==="incomeBasis"?` The map is currently running on <b>${esc(basis().label)}</b>.`:"")));

  // 5. what's blocked
  if(!anyBalanceSet())
    push("grey","·","Net worth is unanswerable until you fill in five numbers",
      `Cash, both investment balances and both CPF balances are all blank. Liabilities are known (<b>${fmt(liabilitiesAt(M.today))}</b> today), so the moment you enter assets the whole page resolves.`);

  // 6. liabilities timing
  const sl=M.liabilities.find(l=>l.repayIdx!=null);
  if(sl) push("pine","→",`${sl.name} starts amortising ${miLong(sl.repayIdx)}`,
    `<b>${fmt(sl.outstanding)}</b> outstanding, falling ${fmt(sl.repayMonthly)}/month from then — clear in <b>${Math.ceil(sl.outstanding/sl.repayMonthly)} months</b>. That repayment is cash out but net-worth neutral, so the line above doesn't dip for it.`);
  const mg=M.liabilities.find(l=>l.startsIdx!=null);
  if(mg) push("grey","·",`${mg.name} is excluded from the line`,
    `${fmt(mg.principal)} from ${miLong(mg.startsIdx)}. It is drawn to buy a property whose value isn't recorded anywhere in your data, so counting the debt without the asset would show a false collapse. It appears as a dotted marker only.`);

  // 7. the source's own decisions, preserved
  (M.raw.decisions||[]).forEach(x=>push("pine","→",esc(x.name),esc(x.detail)));
  return out.map(i=>Object.assign(i,{col:T[i.tone]}));
}

  const host=$("#p-brief"); if(!host) return;

function drawConstellation(){
  const svg=$("#const"); if(!svg) return;
  const cx=310,cy=270,R0=92,RSPAN=116;
  const maxTotal=Math.max(...M.goals.map(g=>g.total||0),1);
  const nowM=M.today+S.cursor;
  const rem=g=>g.target==null?30:(g.target-nowM);
  const maxRem=Math.max(12,...M.goals.map(g=>Math.max(0,rem(g))));
  const orbitR=g=>{const r=rem(g); return r<=0?R0:R0+(Math.min(r,maxRem)/maxRem)*RSPAN;};
  const rings=[0,.5,1].map(f=>`<circle class="orbit" cx="${cx}" cy="${cy}" r="${R0+f*RSPAN}"/>`).join("");

  const nodes=M.goals.map((g,i)=>{
    const a=(-Math.PI/2)+(i/M.goals.length)*Math.PI*2, R=orbitR(g);
    const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R;
    const rad=15+Math.sqrt((g.total||0)/maxTotal)*24;
    const col=g.tone==="red"?"var(--clay)":g.tone==="amber"?"var(--caramel)":g.tone==="green"?"var(--pine)":"var(--ink-faint)";
    const f=goalFunded(g.id), known=f!=null;
    const frac=g.total&&known?clamp(f/g.total,0,1):0;
    const C=2*Math.PI*(rad+6);
    return `<g class="goal-node ${S.selectedGoal===g.id?"sel":""}" data-goal="${g.id}" style="animation:rise .5s ${i*60}ms both">
      <circle class="halo" cx="${x}" cy="${y}" r="${rad+18}" fill="${col}"/>
      <line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${col}" stroke-opacity=".18"/>
      <circle cx="${x}" cy="${y}" r="${rad}" fill="${col}" fill-opacity=".13" stroke="${col}" stroke-opacity=".5"/>
      <circle cx="${x}" cy="${y}" r="${rad+6}" fill="none" stroke="${known?col:"var(--line)"}"
              stroke-width="3" stroke-dasharray="${(frac*C).toFixed(1)} ${C}" stroke-linecap="round"
              transform="rotate(-90 ${x} ${y})"/>
      ${known?"":`<circle cx="${x}" cy="${y}" r="${rad+6}" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 5"/>`}
      <text class="goal-name" x="${x}" y="${y+1}">${esc(g.name)}</text>
      <text class="goal-sub" x="${x}" y="${y+13}">${fmt(g.total,{compact:true})}</text></g>`;}).join("");

  svg.innerHTML=`${rings}
    <circle cx="${cx}" cy="${cy}" r="46" fill="var(--paper-2)" stroke="var(--line)"/>
    <text x="${cx}" y="${cy-3}" class="goal-name" style="font-size:11px">${S.cursor?miLabel(nowM):"TODAY"}</text>
    <text x="${cx}" y="${cy+12}" class="goal-sub">${M.goals.length} goals</text>
    <text class="orbit-label" x="${cx+R0+6}" y="${cy-5}">sooner</text>
    <text class="orbit-label" x="${cx+R0+RSPAN-26}" y="${cy-5}">later</text>
    ${nodes}`;
  $$(".goal-node",svg).forEach(n=>n.onclick=()=>{S.selectedGoal=n.dataset.goal; drawConstellation(); renderGoalDetail();});
  renderGoalDetail();
}

    </div>
    <div style="margin-top:13px"><button class="btn" id="g-map">Show on cash map</button></div>`;
  $("#g-map").onclick=()=>{
    const e=M.events.find(x=>x.goalId===g.id);

    if(e){S.cursor=clamp(Math.max(e.month,M.today)-M.today,0,S.horizon); const sl=$("#slider"); if(sl) sl.value=S.cursor; refresh();}
  };
}

async function whoami(){
  try{
    const r=await fetch("/cdn-cgi/access/get-identity",{credentials:"include"});
    if(!r.ok) return;
    const id=await r.json();
    if(id&&id.email){
      const w=$("#who"); if(w) w.textContent="Signed in as "+id.email;
      const g=$("#gateLock"); if(g) g.textContent="🔒 Cloudflare Access";
    }
  }catch(_){/* not behind Access */}
}

/* ---- gate ---- */
(function(){
  const gate=$("#gate"), pins=$$("#pin i"); let filled=0;
  function enter(){ gate.classList.add("hide"); $("#app").classList.add("show");
    setTimeout(()=>{gate.style.display="none";},700); }
  $("#enterBtn").onclick=enter;
  addEventListener("keydown",e=>{
    if(gate.classList.contains("hide")) return;
    if(e.key==="Enter") enter();
    else if(/^[0-9]$/.test(e.key)&&filled<4){pins[filled].classList.add("on"); filled++; if(filled===4) setTimeout(enter,260);}
    else if(e.key==="Backspace"&&filled>0){filled--; pins[filled].classList.remove("on");}
  });
})();
