<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Finance Intern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ==================================================================
     Finance Intern — presentation layer only.
     CONTAINS NO FIGURES. Every number is read from data/finance.json.
     Palette from Steven (steven_os_home.html).
     ================================================================== */
  :root{
    color-scheme: light;
    --canvas:#ece1cd; --paper:#f8f0e2; --paper-2:#f1e7d5;
    --ink:#33291d; --ink-soft:#7b6a52; --ink-faint:#a8967a;
    --clay:#af6a3e; --clay-deep:#8f5330; --caramel:#c48a4c; --clay-soft:#f0e0cd;
    --pine:#5e6b4d; --pine-soft:#e6e6d3; --pine-deep:#46513a;
    --line:#e3d5bd; --line-soft:#ece1cc;
    --black:#241c12;
    --shadow: 0 1px 2px rgba(60,44,26,.05), 0 10px 26px -14px rgba(60,44,26,.22);
    --shadow-lg: 0 3px 8px rgba(60,44,26,.08), 0 26px 60px -22px rgba(60,44,26,.34);
    --r:16px; --r-sm:11px;
    --serif:"Fraunces","Iowan Old Style",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --c1:#af6a3e; --c2:#5e6b4d; --c3:#c48a4c; --c4:#7d8ba1; --c5:#9a6b70; --c6:#8a8f6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans); background:var(--canvas); color:var(--ink);
       -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;}
  ::selection{background:var(--clay-soft);}

  /* ============ APP ============ */
  /* The gate styles moved to functions/_middleware.js, which now serves the
     PIN screen as its own document before this file is ever reachable. */
  .app{display:block;}
  .signout{border:0; background:none; padding:0; font:inherit; font-size:11.5px; color:var(--ink-faint);
    cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
  .signout:hover{color:var(--clay-deep);}
  .wrap{max-width:1400px; margin:0 auto; padding:24px clamp(16px,3vw,38px) 70px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
          padding-bottom:18px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:11px;}
  .brand-badge{width:36px; height:36px; border-radius:11px; flex:none;
    background:linear-gradient(150deg,var(--clay),var(--clay-deep)); display:flex; align-items:center;
    justify-content:center; color:#f6ecda; font-family:var(--serif); font-weight:600; font-size:20px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18);}
  .brand-name{font-family:var(--serif); font-weight:500; font-size:21px; line-height:1;}
  .brand-sub{font-size:11px; color:var(--ink-faint); letter-spacing:.05em; margin-top:3px;}
  .topbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .who{font-size:11.5px; color:var(--ink-faint);}

  /* FAQ sits apart, to the left of the tab group, in black */
  .tab-faq{border:1px solid var(--black); background:var(--black); color:#f6ecda; font:inherit;
    font-size:13px; font-weight:500; padding:11px 19px; border-radius:100px; cursor:pointer;
    transition:.18s; box-shadow:var(--shadow); white-space:nowrap;}
  .tab-faq:hover{background:#3a2e1f; border-color:#3a2e1f;}
  .tab-faq[aria-selected="true"]{background:#000; border-color:#000; font-weight:600;}
  .tabs{display:flex; gap:4px; background:var(--paper-2); border:1px solid var(--line);
        border-radius:100px; padding:4px;}
  .tab{border:0; background:transparent; color:var(--ink-soft); font:inherit; font-size:13px; font-weight:500;
       padding:7px 17px; border-radius:100px; cursor:pointer; transition:.18s; white-space:nowrap;}
  .tab:hover{color:var(--ink);}
  .tab[aria-selected="true"]{background:var(--clay); color:#f8f0e2; font-weight:600; box-shadow:var(--shadow);}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);}
  .pad{padding:18px 20px;}
  .sec-head{display:flex; align-items:baseline; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .sec-head h2{font-family:var(--serif); font-weight:500; font-size:18px; margin:0;}
  .sec-head .hint{font-size:11.5px; color:var(--ink-faint);}
  .sec-head .sp{flex:1;}
  .num{font-variant-numeric:tabular-nums;}
  .unk{color:var(--ink-faint); font-style:italic; font-weight:400;}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:100px;
        font-size:11px; font-weight:500; letter-spacing:.04em; white-space:nowrap;}
  .chip::before{content:""; width:5px; height:5px; border-radius:50%; background:currentColor;}
  .chip.clay{color:var(--clay-deep); background:var(--clay-soft);}
  .chip.pine{color:var(--pine); background:var(--pine-soft);}
  .chip.grey{color:var(--ink-faint); background:var(--paper-2);}
  .chip.plain::before{display:none;}
  .btn{border:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft); font:inherit;
       font-size:12.5px; font-weight:500; padding:7px 14px; border-radius:100px; cursor:pointer; transition:.16s;}
  .btn:hover{color:var(--ink); border-color:var(--clay); background:var(--clay-soft);}
  .btn.primary{background:var(--clay); border-color:var(--clay); color:#f8f0e2; font-weight:600;}
  .btn.primary:hover{background:var(--clay-deep); border-color:var(--clay-deep); color:#fff;}
  .btn.sm{padding:4px 10px; font-size:11.5px;}
  select, input[type=number]{font:inherit; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 12px; font-size:13.5px;}
  select:focus, input[type=number]:focus{outline:none; border-color:var(--clay); box-shadow:0 0 0 3px var(--clay-soft);}
  input[type=number]{font-variant-numeric:tabular-nums;}

  .controlrow{display:grid; grid-template-columns:minmax(230px,290px) 1fr; gap:16px; margin-bottom:16px;}
  .monthpick{display:flex; flex-direction:column; justify-content:center; gap:9px;}
  .monthpick .lbl{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}
  .monthpick .row{display:flex; gap:8px;}
  .monthpick select{flex:1; min-width:0;}
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  .kpi{display:flex; flex-direction:column; gap:5px; padding:16px 18px;}
  .kpi .ic{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; margin-bottom:3px;}
  .kpi .kl{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint);}
  .kpi .kv{font-family:var(--serif); font-weight:500; font-size:26px; line-height:1.05;}
  .kpi .kn{font-size:11px; color:var(--ink-faint); line-height:1.45;}

  .row-map{display:grid; grid-template-columns:1.62fr 1fr; gap:16px; margin-bottom:16px;}
  .row-three{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px;}
  .stack{display:grid; gap:16px;}

  svg.viz{display:block; width:100%; height:auto; overflow:visible;}
  .ax{font-size:10px; fill:var(--ink-faint);}
  .axt{font-size:10.5px; fill:var(--ink-soft); font-weight:500;}
  .ev-label{font-size:10px; font-weight:600;}
  .ev-node{cursor:grab;} .ev-node:active{cursor:grabbing;}
  .ev-node circle.hit{fill:transparent;}

  .axis-slider{position:relative; margin-top:2px;}
  input[type=range]{-webkit-appearance:none; appearance:none; background:transparent; width:100%; height:20px;
    cursor:grab; display:block; margin:0;}
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--ink-faint); opacity:.55;}
  input[type=range]::-moz-range-track{height:2px; background:var(--ink-faint); opacity:.55;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    margin-top:-7px; background:var(--clay); border:2.5px solid var(--paper); box-shadow:0 0 0 1px var(--clay), var(--shadow);}
  input[type=range]::-moz-range-thumb{width:13px; height:13px; border-radius:50%;
    background:var(--clay); border:2.5px solid var(--paper); box-shadow:0 0 0 1px var(--clay);}
  .ticks{position:relative; height:26px; margin-top:-2px;}
  .ticks b{position:absolute; transform:translateX(-50%); font-size:10.5px; color:var(--ink-faint);
           font-weight:500; white-space:nowrap; padding-top:7px;}
  .ticks b::before{content:""; position:absolute; left:50%; top:0; width:1px; height:5px; background:var(--line);}
  .horizon{display:flex; gap:3px; background:var(--paper-2); border:1px solid var(--line); border-radius:100px; padding:3px;}
  .horizon button{border:0; background:transparent; color:var(--ink-faint); font:inherit; font-size:11.5px;
    font-weight:500; padding:5px 12px; border-radius:100px; cursor:pointer;}
  .horizon button[aria-pressed="true"]{background:var(--paper); color:var(--ink); box-shadow:var(--shadow); font-weight:600;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft);}
  .legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:-1px;}
  .scenario-bar{display:none; align-items:center; gap:12px; flex-wrap:wrap; background:var(--clay-soft);
    border:1px solid #e7cdb2; border-radius:var(--r-sm); padding:10px 14px; margin-top:12px;
    font-size:12.5px; color:var(--clay-deep);}
  .scenario-bar.on{display:flex;}

  /* constellation */
  .const-wrap{display:grid; grid-template-columns:1.5fr 1fr; gap:18px;}
  .goal-node{cursor:pointer;}
  .goal-node .halo{opacity:0; transition:opacity .25s;}
  .goal-node:hover .halo,.goal-node.sel .halo{opacity:.22;}
  .goal-name{font-size:11px; font-weight:600; fill:var(--ink); text-anchor:middle; pointer-events:none;}
  .goal-sub{font-size:9.5px; fill:var(--ink-soft); text-anchor:middle; pointer-events:none;}
  .orbit{fill:none; stroke:var(--line); stroke-width:1;}
  .orbit-label{font-size:9px; fill:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase;}
  .drow{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13px;}
  .drow:last-child{border-bottom:0;}
  .drow .l{color:var(--ink-soft);} .drow .v{font-weight:600; text-align:right;}
  .meter{height:6px; border-radius:3px; background:var(--paper-2); border:1px solid var(--line); overflow:hidden; margin-top:12px;}
  .meter>i{display:block; height:100%; background:linear-gradient(90deg,var(--clay),var(--caramel)); transition:width .5s cubic-bezier(.4,0,.2,1);}

  /* goal amount editors */
  .goal-edit{display:grid; grid-template-columns:repeat(auto-fit,minmax(228px,1fr)); gap:13px;
    margin-top:18px; padding-top:16px; border-top:1px solid var(--line-soft);}
  .ge{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:13px 14px;}
  .ge .gh{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
  .ge .gn{font-weight:600; font-size:13.5px; flex:1;}
  .ge .stepper{display:flex; align-items:center; gap:6px;}
  .ge .stepper button{border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    width:26px; height:26px; border-radius:50%; cursor:pointer; font:inherit; font-size:14px; line-height:1;
    display:grid; place-items:center; flex:none;}
  .ge .stepper button:hover{border-color:var(--clay); color:var(--clay-deep); background:var(--clay-soft);}
  .ge .stepper input{flex:1; min-width:0; text-align:center; padding:7px 6px; font-weight:600;}
  .ge .gm{font-size:11.5px; color:var(--ink-faint); margin-top:9px; line-height:1.5;}
  .ge .gm b{color:var(--clay-deep); font-weight:600;}
  .src-tag{font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px;
    border-radius:100px; font-weight:600;}
  .src-cpf{background:var(--pine-soft); color:var(--pine-deep);}
  .src-cash{background:var(--clay-soft); color:var(--clay-deep);}

  /* ask */
  .ask-box{position:relative;}
  .ask-input{width:100%; background:var(--paper-2); border:1px solid var(--line); border-radius:100px;
    color:var(--ink); font:inherit; font-size:14.5px; padding:15px 108px 15px 22px; transition:.18s;}
  .ask-input::placeholder{color:var(--ink-faint);}
  .ask-input:focus{outline:none; border-color:var(--clay); background:var(--paper); box-shadow:0 0 0 4px var(--clay-soft);}
  .ask-go{position:absolute; right:7px; top:50%; transform:translateY(-50%);}
  .ask-suggest{display:flex; gap:8px; flex-wrap:wrap; margin-top:11px;}
  .sugg{border:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft); font:inherit;
    font-size:11.5px; padding:6px 12px; border-radius:100px; cursor:pointer;}
  .sugg:hover{color:var(--clay-deep); border-color:var(--clay); background:var(--clay-soft);}
  .options{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px; margin-top:16px;}
  .opt{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:16px 17px;
       display:flex; flex-direction:column; gap:11px; animation:rise .42s cubic-bezier(.22,1,.36,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .opt.previewing{border-color:var(--clay); box-shadow:0 0 0 3px var(--clay-soft);}
  .opt .o-title{font-family:var(--serif); font-size:15px; font-weight:500; line-height:1.25;}
  .opt .o-why{font-size:12.5px; color:var(--ink-soft); line-height:1.55;}
  .impact{display:grid; gap:7px;}
  .imp-row{display:grid; grid-template-columns:78px 1fr auto; align-items:center; gap:9px; font-size:11px;}
  .imp-row .il{color:var(--ink-faint);}
  .imp-bar{height:4px; border-radius:2px; background:var(--line-soft); position:relative; overflow:hidden;}
  .imp-bar>i{position:absolute; top:0; bottom:0; border-radius:2px;}
  .imp-row .iv{font-weight:600; font-variant-numeric:tabular-nums;}
  .tradeoff{font-size:11.5px; color:var(--clay-deep); line-height:1.5; display:flex; gap:7px;}
  .tradeoff span:first-child{flex:none; font-weight:600;}
  .o-foot{margin-top:auto; display:flex; gap:8px;}

  .fill-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:13px;}
  .fill-f{display:flex; flex-direction:column; gap:6px;}
  .fill-f label{font-size:11.5px; color:var(--ink-soft); font-weight:500;}
  .fill-f .wrapin{position:relative; display:flex; align-items:center;}
  .fill-f .cur{position:absolute; left:12px; font-size:12.5px; color:var(--ink-faint); pointer-events:none;}
  .fill-f input{width:100%; padding-left:34px;}
  .fill-f input.set{border-color:var(--pine); background:var(--pine-soft);}
  .fill-f .wrapin.readonly input{background:var(--paper-2); color:var(--ink-soft); cursor:default;}
  .fill-f .wrapin.readonly input.set{border-color:var(--pine); background:var(--pine-soft); color:inherit;}
  .linkbtn{border:0; background:none; padding:0; margin-left:5px; font:inherit; font-size:10.5px;
           color:var(--pine-deep); text-decoration:underline; cursor:pointer;}
  .linkbtn:hover{color:var(--ink);}

  .bitem{display:grid; grid-template-columns:24px 1fr; gap:13px; padding:14px 0; border-bottom:1px solid var(--line-soft);}
  .bitem:last-child{border-bottom:0;}
  .bi{width:24px; height:24px; border-radius:8px; display:grid; place-items:center; font-size:12px; font-weight:600;}
  .bt{font-weight:600; font-size:14px; margin-bottom:3px;}
  .bd{font-size:13px; color:var(--ink-soft); line-height:1.6;}
  .bd b{color:var(--ink); font-weight:600;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--line-soft);}
  th{color:var(--ink-faint); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:.08em;}
  td.r{text-align:right; font-variant-numeric:tabular-nums;}
  .lst{list-style:none; padding:0; margin:0;}
  .lst li{padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13px; color:var(--ink-soft);
          display:flex; justify-content:space-between; gap:16px;}
  .lst li:last-child{border-bottom:0;}
  .lst li>span:first-child{color:var(--ink); font-weight:500; flex:none;}

  .integrity{display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:11.5px;
    color:var(--ink-faint); background:var(--paper-2); border:1px solid var(--line);
    border-radius:100px; padding:8px 16px; margin-bottom:16px;}
  .integrity .go{color:var(--clay-deep); cursor:pointer; font-weight:500; border-bottom:1px dashed var(--caramel);}
  .empty{display:grid; place-items:center; text-align:center; padding:38px 20px; color:var(--ink-faint);
    font-size:13px; line-height:1.7;}
  .empty .big{font-family:var(--serif); font-size:19px; color:var(--ink-soft); margin-bottom:6px;}
  .view{display:none;} .view.on{display:block; animation:fade .3s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .foot{text-align:center; color:var(--ink-faint); font-size:11.5px; margin-top:28px; line-height:1.7;}

  /* FAQ */
  .faq-hero{background:var(--black); color:#f6ecda; border-radius:var(--r); padding:38px 40px; margin-bottom:16px;}
  .faq-hero h1{font-family:var(--serif); font-weight:500; font-size:36px; margin:0 0 10px; line-height:1.1;}
  .faq-hero p{margin:0; font-size:15px; line-height:1.7; opacity:.82; max-width:70ch;}
  .faq-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px;}
  .faq-q{font-family:var(--serif); font-weight:500; font-size:19px; margin:0 0 10px;}
  .faq-a{font-size:13.5px; line-height:1.75; color:var(--ink-soft);}
  .faq-a b{color:var(--ink); font-weight:600;}
  .faq-a ul{margin:10px 0 0; padding-left:18px;}
  .faq-a li{margin-bottom:7px;}
  .faq-a code{background:var(--paper-2); padding:1px 5px; border-radius:5px; font-size:12px;}
  .flow{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:14px 0 4px;}
  .flow .n{background:var(--paper-2); border:1px solid var(--line); border-radius:100px;
    padding:5px 11px; font-size:11.5px; font-weight:500; white-space:nowrap;}
  .flow .n.dark{background:var(--black); color:#f6ecda; border-color:var(--black);}
  .flow .n.clay{background:var(--clay-soft); border-color:#e7cdb2; color:var(--clay-deep);}
  .flow .ar{color:var(--ink-faint); font-size:14px;}

  .tip{position:fixed; pointer-events:none; z-index:90; opacity:0; transition:opacity .13s;
    background:var(--ink); color:#f6ecda; border-radius:9px; padding:9px 12px; font-size:11.5px;
    line-height:1.55; max-width:262px; box-shadow:var(--shadow-lg);}
  .tip.on{opacity:1;}
  .tip .tt{font-weight:600; margin-bottom:3px;}
  .tip .td{opacity:.8;}

  @media (max-width:1180px){
    .row-map{grid-template-columns:1fr;} .row-three{grid-template-columns:1fr;}
    .const-wrap{grid-template-columns:1fr;}
    .controlrow{grid-template-columns:1fr;} .kpis{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:620px){ .kpis{grid-template-columns:1fr;} .faq-hero{padding:26px 22px;} .faq-hero h1{font-size:28px;} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
</style>
</head>
<body>

<!-- The PIN screen is served by functions/_middleware.js. Reaching this file at
     all means the session cookie already verified, so the app renders directly. -->

<div class="app" id="app"><div class="wrap" id="root"><div class="card pad">Loading…</div></div></div>
<div class="tip" id="tip"></div>

<script>
"use strict";
/* ================= 0. HELPERS ================= */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function money(str){
  if(str==null) return null;
  if(typeof str==="number") return isFinite(str)?str:null;
  const m=String(str).replace(/,/g,"").match(/-?\$?\s*(\d+(?:\.\d+)?)/);
  return m&&isFinite(parseFloat(m[1]))?parseFloat(m[1]):null;
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONFULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const mi=(y,m)=>y*12+m, miY=i=>Math.floor(i/12), miM=i=>((i%12)+12)%12;
const miLabel=i=>MON[miM(i)]+" "+String(miY(i)).slice(2);
const miLong=i=>MON[miM(i)]+" "+miY(i);
function parseWhen(str){
  if(!str) return null; const s=String(str).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{2})/))) return mi(+m[1],+m[2]-1);
  if((m=s.match(/\bQ([1-4])\s*(\d{4})\b/i))) return mi(+m[2],(+m[1]-1)*3);
  return null;
}
const fmt=(n,o)=>{
  o=o||{};
  if(n==null||!isFinite(n)) return "—";
  const sign=n<0?"−":(o.signed&&n>0?"+":""), a=Math.abs(n);
  if(o.compact&&a>=1000){const k=a/1000; return sign+"$"+(k>=100?Math.round(k):k.toFixed(k>=10?0:1))+"k";}
  return sign+"$"+(o.cents?a.toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2})
                          :Math.round(a).toLocaleString("en-SG"));
};

/* ================= 1. MODEL =================
   One model per scope (joseph / melissa / combined). `M` points at whichever
   tab is mounted; only one person tab is in the DOM at a time, so every render
   function below keeps reading `M` and its fixed element ids, unchanged. */
let M={};
const SCOPES={};                    // id -> {raw, model, opts}
const ORDER=["joseph","melissa","combined"];
let ACTIVE="joseph";

function buildModel(d){
  const M={};
  M.raw=d;
  M.scope=d.scope||{id:"joseph",person:"Joseph",label:"Joseph"};
  M.isPlaceholder=!!d.placeholder;
  const A=d.actuals||{};
  M.salaryFrom=parseWhen(d.employment?.startedWork);
  M.salary={
    people:(d.salary?.rows||[]).map(r=>({name:r.name,gross:money(r.gross),cpf:money(r.cpf),takeHome:money(r.takeHome)})),
    gross:money(d.salary?.total?.gross), cpf:money(d.salary?.total?.cpf), takeHome:money(d.salary?.total?.takeHome),
    source:d.salary?.source, note:d.salary?.note
  };
  M.joseph=M.salary.people.find(p=>/joseph/i.test(p.name))||M.salary.people[0]||{};
  M.melissa=M.salary.people.find(p=>/melissa/i.test(p.name))||{};

  // ledger months; salary is added from the month employment started
  M.months=(A.months||[]).map(r=>{
    const idx=parseWhen(r.m);
    const salaried=M.salaryFrom!=null&&idx>=M.salaryFrom;
    const salary=salaried?(M.joseph.takeHome||0):0;
    return {key:r.m, idx, ledgerIncome:r.income, salary, income:r.income+salary,
            expense:r.expense, cashFlow:r.income+salary-r.expense, partial:!!r.partial, salaried};
  });
  M.today=M.months.length?M.months[M.months.length-1].idx:(parseWhen(d.period?.generatedAt)||mi(2026,7));

  M.expenseCats=(A.expenseByCategory?.rows||[]).filter(r=>r.amount>0).sort((a,b)=>b.amount-a.amount);
  M.expenseCatsMonth=A.expenseByCategory?.month||null;
  M.yearTotals=A.yearTotals||null;

  M.balanceFields=(d.balances?.fields||[]).map(f=>Object.assign({},f));
  M.liabilities=(d.liabilities?.rows||[]).map(r=>Object.assign({},r,{
    startsIdx:parseWhen(r.startsOn), repayIdx:parseWhen(r.repayStarts)}));
  M.recurring=(d.recurring?.items||[]);

  M.goals=(d.goals?.rows||[]).map(g=>Object.assign({},g,{due_i:parseWhen(g.due)}));
  M.ef=d.emergencyFund||null;
  if(M.ef && M.ef.basis==="combinedTakeHome" && M.salary.takeHome!=null)
    M.ef.amount=M.salary.takeHome*(M.ef.months||2);

  M.proj=d.projection||{};
  return M;
}

/** Combined is derived in the browser and never stored. Household facts —
 *  goals, liabilities, the emergency fund — live once, in Joseph's file, and
 *  are carried through here rather than duplicated into Melissa's. */
function buildCombinedRaw(dJ,dM){
  const c=JSON.parse(JSON.stringify(dJ));
  c.scope={id:"combined",person:"Combined",label:"Combined",
    note:"Derived in the browser from Joseph's and Melissa's datasets. Nothing on this tab is stored."};
  c.placeholder=false;
  c.salary={
    source:"Joseph "+(dJ.salary?.source||"")+" · Melissa "+(dM.salary?.source||""),
    rows:[...(dJ.salary?.rows||[]),...(dM.salary?.rows||[])]
         .filter((r,i,a)=>a.findIndex(x=>x.name===r.name)===i),
    total:dJ.salary?.total,
    note:"Combined household income. CPF is not spendable cash."
  };
  const jTake=money(dJ.salary?.rows?.find(r=>/joseph/i.test(r.name))?.takeHome)||0;
  const mTake=money(dM.salary?.rows?.find(r=>/melissa/i.test(r.name))?.takeHome)||0;
  c.projection=Object.assign({},dJ.projection,{incomeMonthly:jTake+mTake,includeMelissaByDefault:true,melissaMonthly:0});
  c.balances={currency:"SGD",asOf:null,fields:[
    {key:"cashCombined", label:"Combined Cash Balance",       value:null, owner:"household", derived:true},
    {key:"invCombined",  label:"Combined Investment Balance", value:null, owner:"household", derived:true},
    {key:"cpfOaCombined",label:"Combined CPF OA Balance",     value:null, owner:"household", derived:true}
  ]};
  c.ledgerNote=(dM.placeholder||!(dM.actuals?.months||[]).length)
    ? "Ledger actuals are Joseph's only — Melissa's source sheet is not connected yet, so no household total is claimed."
    : null;
  c.footer="Finance Intern — Steven · Combined (derived from both datasets)";
  return c;
}

/* ================= 2. STATE ================= */
const LS="financeIntern.v3";
const S={tab:"joseph", horizon:24, cursor:0, month:null, balances:{}, goalAmt:{},
         includeMelissa:false, shifts:{}, preview:null, selectedGoal:null};
/* ---- persistence ----------------------------------------------------------
   Typed numbers live server-side in KV (functions/api/state.js) so they survive
   a refresh and follow you to any device behind the same PIN. localStorage is
   kept only as an offline mirror — if the server is unreachable the dashboard
   keeps working and says which mode it is in, rather than quietly losing input. */
const SYNC={mode:"loading", at:null, err:null, inflight:false, timer:null,
            pending:{set:{},unset:[],goalAmt:{},unsetGoalAmt:[]}};
const emptyPatch=()=>({set:{},unset:[],goalAmt:{},unsetGoalAmt:[]});
const pendingEmpty=p=>!Object.keys(p.set).length&&!p.unset.length
                    &&!Object.keys(p.goalAmt).length&&!p.unsetGoalAmt.length;

function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify(
  {balances:S.balances,goalAmt:S.goalAmt,includeMelissa:S.includeMelissa}));}catch(_){}}
function loadCache(){try{const j=JSON.parse(localStorage.getItem(LS)||"{}");
  S.balances=j.balances||{}; S.goalAmt=j.goalAmt||{}; S.includeMelissa=!!j.includeMelissa;}catch(_){}}

function setSync(mode,err){SYNC.mode=mode; if(err!==undefined) SYNC.err=err; paintSync();}
function syncText(){
  if(SYNC.mode==="loading") return ["grey","Loading…"];
  if(SYNC.mode==="saving")  return ["grey","Saving…"];
  if(SYNC.mode==="server")  return ["pine","Saved · syncs across devices"];
  return ["clay","This device only — "+(SYNC.err||"server unavailable")];
}
function paintSync(){
  const el=$("#sync-chip"); if(!el) return;
  const [tone,text]=syncText();
  el.className="chip "+tone; el.textContent=text;
  el.title=SYNC.at?"Last saved "+new Date(SYNC.at).toLocaleString():"";
}

async function pullServer(){
  const r=await fetch("/api/state",{credentials:"same-origin",cache:"no-store"});
  if(!r.ok){
    let m="HTTP "+r.status;
    try{const j=await r.json(); if(j&&j.message) m=j.message;}catch(_){}
    throw new Error(m);
  }
  return r.json();
}

/** First load: server is authoritative. If it has nothing yet but this browser
 *  does, the local values are pushed up rather than discarded — that carries
 *  across anything typed before the dashboard could save. */
async function loadState(){
  loadCache();
  const localVals=Object.assign({},S.balances), localGoals=Object.assign({},S.goalAmt);
  try{
    const j=await pullServer();
    S.balances=j.values||{}; S.goalAmt=j.goalAmt||{};
    SYNC.at=j.updatedAt; setSync("server",null);
    const serverEmpty=!Object.keys(S.balances).length&&!Object.keys(S.goalAmt).length;
    const haveLocal=Object.keys(localVals).length||Object.keys(localGoals).length;
    if(serverEmpty&&haveLocal){
      S.balances=localVals; S.goalAmt=localGoals;
      queueSave({set:localVals,goalAmt:localGoals});
      await flushSave();
    }
  }catch(e){
    S.balances=localVals; S.goalAmt=localGoals;      // keep working offline
    setSync("local",e.message);
  }
  cacheLocal();
}

function queueSave(patch){
  const p=SYNC.pending;
  Object.assign(p.set,patch.set||{});
  Object.assign(p.goalAmt,patch.goalAmt||{});
  (patch.unset||[]).forEach(k=>{delete p.set[k]; if(!p.unset.includes(k)) p.unset.push(k);});
  (patch.unsetGoalAmt||[]).forEach(k=>{delete p.goalAmt[k]; if(!p.unsetGoalAmt.includes(k)) p.unsetGoalAmt.push(k);});
  cacheLocal();
  setSync("saving");
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(flushSave,600);
}

async function flushSave(){
  clearTimeout(SYNC.timer);
  if(SYNC.inflight){SYNC.timer=setTimeout(flushSave,300); return;}
  if(pendingEmpty(SYNC.pending)) return;
  const body=SYNC.pending; SYNC.pending=emptyPatch();
  SYNC.inflight=true;
  try{
    const r=await fetch("/api/state",{method:"PATCH",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok){
      let m="HTTP "+r.status;
      try{const j=await r.json(); if(j&&j.message) m=j.message;}catch(_){}
      throw new Error(m);
    }
    const j=await r.json();
    // Adopt the merged record so a field the other device changed shows up here.
    S.balances=j.values||{}; S.goalAmt=j.goalAmt||{};
    SYNC.at=j.updatedAt; setSync("server",null);
    cacheLocal();
    refreshExceptFill();          // never re-renders #p-fill, so typing isn't interrupted
  }catch(e){
    setSync("local",e.message);   // the local mirror already holds it
  }finally{SYNC.inflight=false;}
}

/* Coming back to the tab picks up anything the other device saved. */
async function syncOnFocus(){
  if(SYNC.mode==="local"||SYNC.inflight||!pendingEmpty(SYNC.pending)) return;
  try{
    const j=await pullServer();
    if(j.updatedAt===SYNC.at) return;
    S.balances=j.values||{}; S.goalAmt=j.goalAmt||{};
    SYNC.at=j.updatedAt; setSync("server",null); cacheLocal();
    if(!/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||"")){
      renderFill(); refresh();
    }
  }catch(_){/* transient — the chip only changes on a failed write */}
}

/* Balance keys are unique across scopes, so one flat store serves all tabs.
   The combined trio is derived, never typed — see DERIVED. */
const FIELDS={};
/* The combined trio is typed in its own right — a joint account is a real
   balance, not an arithmetic result. Where it hasn't been typed it falls back
   to the sum of the two sides so the tab isn't blank for no reason. */
const PARTS={
  cashCombined :["cashJoseph","cashMelissa"],
  invCombined  :["invJoseph","invMelissa"],
  cpfOaCombined:["cpfOaJoseph","cpfOaMelissa"]
};
function registerFields(model){ (model.balanceFields||[]).forEach(f=>{FIELDS[f.key]=f;}); }
function rawBal(k){
  if(S.balances[k]!=null) return S.balances[k];
  const f=FIELDS[k];
  return f&&f.value!=null?f.value:null;
}
function sumParts(k){
  const parts=PARTS[k]; if(!parts) return null;
  const vs=parts.map(rawBal);
  return vs.every(v=>v==null)?null:vs.reduce((a,v)=>a+(v||0),0);   // unknown, never 0
}
function balVal(k){
  const v=rawBal(k);
  return v!=null?v:sumParts(k);
}
const isTyped=k=>rawBal(k)!=null;
const anyBalanceSet=()=>M.balanceFields.some(f=>balVal(f.key)!=null);
/* Goals are household-scale, so they always resolve against the combined
   figures regardless of which tab you happen to be on. */
const cpfBalance=()=>balVal("cpfOaCombined");
const cashBalance=()=>balVal("cashCombined");
const goalAmount=g=>S.goalAmt[g.key]!=null?S.goalAmt[g.key]:g.amount;

/* ---- projection inputs ---- */
function basis(){
  const inc=(M.proj.incomeMonthly??M.joseph.takeHome??0)+(S.includeMelissa?(M.proj.melissaMonthly??M.melissa.takeHome??0):0);
  const done=M.months.filter(m=>!m.partial).slice(-3);
  const exp=done.length?done.reduce((a,m)=>a+m.expense,0)/done.length:0;
  const label=ACTIVE==="combined" ? "Joseph + Melissa take-home"
            : ACTIVE==="melissa"  ? "Melissa take-home only"
            : (S.includeMelissa?"Joseph + Melissa take-home":"Joseph take-home only");
  return {income:inc, expense:exp, net:inc-exp, label};
}

/* ---- the funding plan: derived from the timeline, never stored ---- */
function fundingPlan(){
  const cpfAvail=cpfBalance();
  const monthlyCPF=M.salary.cpf||0;
  const rows=M.goals.map(g=>{
    const amt=goalAmount(g);
    const months=Math.max(1,(g.due_i??M.today)-M.today);
    const usesCPF=(g.fundedBy||[]).includes("cpf");
    let cpfPart=0, cashPart=amt, cpfUnknown=false;
    if(usesCPF){
      if(cpfAvail==null){cpfUnknown=true;}                 // never guess a CPF balance
      else{
        const cpfAtDue=cpfAvail+monthlyCPF*months;
        cpfPart=Math.min(amt,cpfAtDue);
        cashPart=amt-cpfPart;
      }
    }
    return {g, amt, months, due:g.due_i, usesCPF, cpfUnknown, cpfPart, cashPart,
            perMonth:amt/months, cashPerMonth:cashPart/months};
  });
  const cashPerMonth=rows.reduce((a,r)=>a+r.cashPerMonth,0);
  const loanPerMonth=M.liabilities.filter(l=>l.repayMonthly&&l.repayIdx!=null).reduce((a,l)=>a+l.repayMonthly,0);
  return {rows, cashPerMonth, loanPerMonth, cpfAvail, monthlyCPF};
}

/** Funded-to-date is the plan applied to elapsed time, so the rings fill as you scrub. */
function fundedAt(r,mIdx){
  const done=clamp(mIdx-M.today,0,r.months);
  return Math.min(r.amt, r.perMonth*done);
}

/* ---- liabilities ---- */
function liabilityAt(l,mIdx){
  if(l.placeholder) return null;
  if(l.startsIdx!=null&&mIdx<l.startsIdx) return 0;
  let out=l.startsIdx!=null?(l.principal||0):(l.outstanding!=null?l.outstanding:(l.principal||0));
  if(l.repayMonthly&&l.repayIdx!=null&&mIdx>=l.repayIdx)
    out=Math.max(0,out-l.repayMonthly*(mIdx-l.repayIdx+1));
  return out;
}
const liabilitiesAt=m=>M.liabilities.reduce((a,l)=>a+(liabilityAt(l,m)||0),0);
const liabilitiesNW=m=>M.liabilities.reduce((a,l)=>a+(l.countsInNetWorth===false?0:(liabilityAt(l,m)||0)),0);

/* ---- net worth projection ---- */
function project(scn){
  const s=scn||S, B=basis(), plan=fundingPlan(), rows=[];
  const known=anyBalanceSet();
  let assets=0;
  M.balanceFields.forEach(f=>{const v=balVal(f.key); if(v!=null) assets+=v;});
  const monthlyCPF=M.salary.cpf||0;

  for(let k=0;k<=s.horizon;k++){
    const month=M.today+k;
    if(k>0){
      assets+=B.net;                       // cash in, cash out
      assets+=monthlyCPF;                  // CPF accrues as an asset, not spendable
      M.liabilities.forEach(l=>{ if(l.repayMonthly&&l.repayIdx!=null&&month>=l.repayIdx&&liabilityAt(l,month-1)>0)
        assets-=l.repayMonthly; });
    }
    const hits=[];
    plan.rows.forEach(r=>{
      const w=s.shifts[r.g.key]!=null?s.shifts[r.g.key]:r.due;
      if(Math.max(w,M.today)===month){ assets-=r.amt; hits.push({name:r.g.name,amount:r.amt}); }
    });
    if(s.preview&&s.preview.month===month){assets-=s.preview.amount; hits.push({name:s.preview.label,amount:s.preview.amount});}
    rows.push({k,month,assets,liab:liabilitiesAt(month),nw:assets-liabilitiesNW(month),hits});
  }
  return {rows,net:B.net,B,plan,known};
}
const cloneScn=o=>Object.assign({},S,{shifts:Object.assign({},S.shifts)},o||{});
const monthRec=()=>M.months.find(m=>m.key===S.month)||M.months[M.months.length-1]||null;

function mountPerson(id){
  const sc=SCOPES[id]; if(!sc) return;
  ACTIVE=id; M=sc.model;
  clearViews(id);
  S.cursor=0; S.shifts={}; S.preview=null; S.selectedGoal=null;

function drawChart(){
  const svg=$("#chart"); if(!svg) return;
  const pr=project(), rows=pr.rows;
  const ghost=S.preview?project(cloneScn({preview:null})).rows:null;
  const all=rows.map(r=>r.nw).concat(ghost?ghost.map(r=>r.nw):[]);
  let lo=Math.min(0,...all), hi=Math.max(0,...all);
  if(lo===hi){lo-=1000;hi+=1000;}
  const p=(hi-lo)*.18; lo-=p; hi+=p;
  const X=k=>CH.pad.l+(k/S.horizon)*(CH.w-CH.pad.l-CH.pad.r);
  const Y=v=>CH.pad.t+(1-(v-lo)/(hi-lo))*(CH.h-CH.pad.t-CH.pad.b);
  const line=rs=>rs.map((r,i)=>(i?"L":"M")+X(r.k).toFixed(1)+" "+Y(r.nw).toFixed(1)).join(" ");
  const area=rs=>line(rs)+` L ${X(S.horizon).toFixed(1)} ${Y(lo).toFixed(1)} L ${X(0).toFixed(1)} ${Y(lo).toFixed(1)} Z`;

  let grid="";
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*(i/4), y=Y(v);
    grid+=`<line x1="${CH.pad.l}" y1="${y}" x2="${CH.w-CH.pad.r}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 5"/>
           <text class="ax" x="${CH.pad.l-8}" y="${y+3.5}" text-anchor="end">${fmt(v,{compact:true})}</text>`;}
  const zeroY=(0>=lo&&0<=hi)?Y(0):null;

  const evs=pr.plan.rows.map(r=>({key:r.g.key,name:r.g.name,amount:r.amt,
      due:S.shifts[r.g.key]!=null?S.shifts[r.g.key]:r.due, base:r.due, hard:r.g.hardDeadline}))
    .concat(M.liabilities.filter(l=>l.startsIdx!=null).map(l=>({key:"L"+l.key,name:l.name,amount:null,
      due:l.startsIdx,base:l.startsIdx,marker:true,note:l.note})));
  const placed=evs.map(e=>({e,k:Math.max(e.due,M.today)-M.today}))
    .filter(o=>o.k>=0&&o.k<=S.horizon).sort((a,b)=>a.k-b.k);
  let lastX=-999,lastRow=1;
  placed.forEach(o=>{const x=X(o.k); o.row=(x-lastX<95)?(lastRow===0?1:0):0; lastX=x; lastRow=o.row;});
  const rowOf=new Map(placed.map(o=>[o.e.key,o.row]));

  const nodes=evs.map(e=>{
    const k=Math.max(e.due,M.today)-M.today;
    if(k<0||k>S.horizon) return "";
    const y=e.marker?CH.pad.t-2:Y(rows[k].nw);
    const col=e.marker?"var(--ink-faint)":(S.shifts[e.key]!=null?"var(--pine)":"var(--clay)");
    const r=e.marker?3.5:clamp(4+Math.sqrt((e.amount||0)/70000)*7,5,12);
    const ly=CH.pad.t-24-(rowOf.get(e.key)||0)*15;
    const anchor=X(k)<CH.pad.l+55?"start":(X(k)>CH.w-CH.pad.r-55?"end":"middle");
    return `<g class="ev-node" data-ev="${esc(e.key)}" data-marker="${!!e.marker}">
      <line x1="${X(k)}" y1="${ly+4}" x2="${X(k)}" y2="${CH.h-CH.pad.b}" stroke="${col}" stroke-opacity=".45" stroke-dasharray="3 4"/>
      <circle class="hit" cx="${X(k)}" cy="${y}" r="19"/>
      <circle cx="${X(k)}" cy="${y}" r="${r}" fill="var(--paper)" stroke="${col}" stroke-width="2"/>
      ${e.marker?"":`<circle cx="${X(k)}" cy="${y}" r="${r*.4}" fill="${col}"/>`}
      <text class="ev-label" x="${X(k)}" y="${ly}" text-anchor="${anchor}" fill="${col}">${esc(e.name)}${e.hard?" ▪":""}</text></g>`;
  }).join("");

  svg.innerHTML=`<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--pine)" stop-opacity=".34"/>
      <stop offset="100%" stop-color="var(--pine)" stop-opacity=".03"/></linearGradient></defs>
    ${grid}
    ${zeroY!=null?`<line x1="${CH.pad.l}" y1="${zeroY}" x2="${CH.w-CH.pad.r}" y2="${zeroY}" stroke="var(--ink-faint)"/>`:""}
    <text class="axt" x="${CH.pad.l-8}" y="${CH.pad.t-32}" text-anchor="end" style="font-size:9.5px;letter-spacing:.08em">NET WORTH</text>
    ${ghost?`<path d="${line(ghost)}" fill="none" stroke="var(--ink-faint)" stroke-width="1.4" stroke-dasharray="4 4"/>`:""}
    <path d="${area(rows)}" fill="url(#gA)"/>
    <path d="${line(rows)}" fill="none" stroke="var(--pine)" stroke-width="2.4" stroke-linejoin="round"
          stroke-linecap="round" ${pr.known?"":'stroke-dasharray="6 4" opacity=".75"'}/>
    <line x1="${X(S.cursor)}" y1="${CH.pad.t-28}" x2="${X(S.cursor)}" y2="${CH.h-CH.pad.b}" stroke="var(--clay-deep)" stroke-opacity=".5"/>
    <circle cx="${X(S.cursor)}" cy="${Y(rows[S.cursor].nw)}" r="5" fill="var(--clay)" stroke="var(--paper)" stroke-width="2.5"/>
    ${nodes}`;
  drawTicks(); wireChart(svg,X);

  const row=rows[S.cursor];
  $("#map-read").innerHTML=`
    <div style="display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px">
      <div><div style="font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)">${S.cursor?"Projected":"Today"}</div>
        <div style="font-family:var(--serif);font-size:25px;line-height:1.1">${miLong(row.month)}</div></div>
      <div><div style="font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)">Net worth</div>
        <div class="num" style="font-family:var(--serif);font-size:25px;line-height:1.1;color:${row.nw<0?"var(--clay-deep)":"var(--pine-deep)"}">
          ${pr.known?fmt(row.nw):'<span class="unk" style="font-size:16px">enter balances</span>'}</div></div>
      <div><div style="font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)">Cash net / month</div>
        <div class="num" style="font-family:var(--serif);font-size:25px;line-height:1.1;color:${pr.net<0?"var(--clay-deep)":"var(--pine-deep)"}">${fmt(pr.net,{signed:true})}</div></div>
      <div style="flex:1"></div>
      <div style="font-size:11px;color:var(--ink-faint);max-width:240px;line-height:1.5;text-align:right">
        ${esc(pr.B.label)} ${fmt(pr.B.income)} less ${fmt(pr.B.expense)} trailing spend${pr.known?"":" · shape only until balances are entered"}</div>
    </div>`;
}

function drawTicks(){
  const host=$("#ticks"); if(!host) return;
  const w=host.clientWidth||1, thumb=16;
  const pct=k=>((thumb/2+(k/S.horizon)*(w-thumb))/w)*100;
  let out="";
  for(let k=0;k<=S.horizon;k+=6) out+=`<b style="left:${pct(k).toFixed(2)}%">${miLabel(M.today+k)}</b>`;
  if(S.horizon%6) out+=`<b style="left:${pct(S.horizon).toFixed(2)}%">${miLabel(M.today+S.horizon)}</b>`;
  host.innerHTML=out;
}

function wireChart(svg,X){
  const tip=$("#tip");
  const toK=cx=>{const b=svg.getBoundingClientRect(); const vx=((cx-b.left)/b.width)*CH.w;
    return clamp(Math.round(((vx-CH.pad.l)/(CH.w-CH.pad.l-CH.pad.r))*S.horizon),0,S.horizon);};
  const plan=fundingPlan();
  $$(".ev-node",svg).forEach(node=>{
    const key=node.dataset.ev, marker=node.dataset.marker==="true";
    const r=plan.rows.find(x=>x.g.key===key);
    node.addEventListener("mousemove",ev=>{
      tip.className="tip on";
      if(r){
        const due=S.shifts[key]!=null?S.shifts[key]:r.due;
        tip.innerHTML=`<div class="tt">${esc(r.g.name)}${r.g.hardDeadline?" · hard deadline":""}</div><div class="td">
          ${fmt(r.amt)} by ${miLong(due)}<br>${Math.max(1,due-M.today)} months → ${fmt(r.amt/Math.max(1,due-M.today))}/mo<br>
          ${r.cpfUnknown?"CPF balance needed — showing as cash":(r.usesCPF?`CPF ${fmt(r.cpfPart)} · cash ${fmt(r.cashPart)}`:"cash only")}
          <br>drag to test a different date</div>`;
      }else{
        const l=M.liabilities.find(x=>"L"+x.key===key);
        tip.innerHTML=`<div class="tt">${esc(l?.name||"")}</div><div class="td">${esc(l?.note||"")}</div>`;
      }
      tip.style.left=Math.min(ev.clientX+14,innerWidth-280)+"px"; tip.style.top=(ev.clientY-12)+"px";});
    node.addEventListener("mouseleave",()=>tip.className="tip");
    if(marker) return;
    node.addEventListener("pointerdown",ev=>{
      ev.preventDefault(); try{node.setPointerCapture(ev.pointerId);}catch(_){}
      const move=m=>{S.shifts[key]=M.today+toK(m.clientX); refresh();};
      const up=()=>{node.removeEventListener("pointermove",move); node.removeEventListener("pointerup",up);
        if(S.shifts[key]===r.due) delete S.shifts[key]; refresh();};
      node.addEventListener("pointermove",move); node.addEventListener("pointerup",up);});
  });
  svg.addEventListener("click",ev=>{
    if(ev.target.closest(".ev-node")) return;
    S.cursor=toK(ev.clientX); const sl=$("#slider"); if(sl) sl.value=S.cursor; refresh();});
}

function renderScenarioBar(){
  const bar=$("#scenario-bar"); if(!bar) return;
  const moved=Object.keys(S.shifts), on=moved.length||S.preview;
  bar.classList.toggle("on",!!on); if(!on) return;
  const plan=fundingPlan();
  const parts=moved.map(k=>{const r=plan.rows.find(x=>x.g.key===k);
      return `<b>${esc(r?.g.name||k)}</b> ${miLabel(r?.due)} → ${miLabel(S.shifts[k])}`;})
    .concat(S.preview?[`previewing <b>${esc(S.preview.label)}</b>`]:[]);

}

/* ================= 6. BARS ================= */
function renderBars(){
  const rec=monthRec(), end=M.months.findIndex(m=>m.key===rec?.key);
  const win=M.months.slice(Math.max(0,end-2),end+1);
  const host=$("#p-bars");
  if(!win.length){host.innerHTML=`<div class="sec-head"><h2>Income vs expenses</h2></div>
    <div class="empty"><div class="big">No ledger</div>
    <div>${M.isPlaceholder?esc(M.scope.person)+"'s source sheet has not been specified yet."
                          :"No monthly totals in the source."}</div></div>`; return;}
  const W=430,H=250,pl=52,pr=10,pt=18,pb=42;
  const max=Math.max(...win.map(m=>Math.max(m.income,m.expense)))*1.16||1;
  const bw=(W-pl-pr)/win.length, gap=bw*.22, sw=(bw-gap*2)/2, Y=v=>pt+(1-v/max)*(H-pt-pb);
  let grid="";
  for(let i=0;i<=3;i++){const v=max*(i/3),y=Y(v);
    grid+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 5"/>
           <text class="ax" x="${pl-7}" y="${y+3.5}" text-anchor="end">${fmt(v,{compact:true})}</text>`;}
  const bars=win.map((m,i)=>{
    const x0=pl+i*bw+gap/2, hi=Math.max(0,H-pb-Y(m.income)), he=Math.max(0,H-pb-Y(m.expense));
    const salH=m.salary?Math.max(0,(m.salary/max)*(H-pt-pb)):0;
    return `<g>
      <rect x="${x0}" y="${Y(m.income)}" width="${sw}" height="${hi}" rx="4" fill="var(--pine)" opacity=".9">
        <title>${MONFULL[miM(m.idx)]} income ${fmt(m.income,{cents:true})}</title></rect>
      ${salH?`<rect x="${x0}" y="${H-pb-salH}" width="${sw}" height="${salH}" rx="4" fill="var(--pine-deep)" opacity=".85">
        <title>${MONFULL[miM(m.idx)]} salary ${fmt(m.salary)}</title></rect>`:""}
      <rect x="${x0+sw+gap}" y="${Y(m.expense)}" width="${sw}" height="${he}" rx="4" fill="var(--clay)" opacity=".9">
        <title>${MONFULL[miM(m.idx)]} expenses ${fmt(m.expense,{cents:true})}</title></rect>
      <text class="axt" x="${x0+sw+gap/2}" y="${H-pb+16}" text-anchor="middle">${MON[miM(m.idx)]} ${String(miY(m.idx)).slice(2)}</text>
      <text class="ax" x="${x0+sw+gap/2}" y="${H-pb+30}" text-anchor="middle"
            fill="${m.cashFlow<0?"var(--clay-deep)":"var(--pine-deep)"}">${fmt(m.cashFlow,{signed:true,compact:true})}</text>
      ${m.partial?`<text class="ax" x="${x0+sw+gap/2}" y="${pt-4}" text-anchor="middle">partial</text>`:""}</g>`;}).join("");
  const anySal=win.some(m=>m.salary>0);
  host.innerHTML=`<div class="sec-head"><h2>Income vs expenses</h2><span class="hint">last 3 months</span>
      <span class="sp"></span><div class="legend">
        ${anySal?'<span><i style="background:var(--pine-deep)"></i>Salary</span>':""}
        <span><i style="background:var(--pine)"></i>Income</span>
        <span><i style="background:var(--clay)"></i>Expenses</span></div></div>
    <svg class="viz" viewBox="0 0 ${W} ${H}">${grid}${bars}</svg>
    <div style="font-size:11.5px;color:var(--ink-faint);margin-top:6px">
      Figure under each pair is that month's cash flow.${anySal?" Darker block is salary from Aug 2026.":""}</div>`;
}

/* ================= 7. DONUTS + EXPENSE RANK ================= */
function donut(items,total,centerLabel,centerSub){
  const W=250,H=190,cx=95,cy=95,R=66,r=42;
  if(!items.length) return null;
  let a0=-Math.PI/2, segs="";
  items.forEach((it,i)=>{
    const frac=total>0?it.value/total:0, a1=a0+frac*Math.PI*2;
    if(frac>=0.9999){
      segs+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--c${(i%6)+1})"
        stroke-width="${R-r}" opacity=".92"><title>${esc(it.name)} ${fmt(it.value)} (100%)</title></circle>`;
      a0=a1; return;}
    const big=(a1-a0)>Math.PI?1:0, p=(rad,a)=>[cx+Math.cos(a)*rad,cy+Math.sin(a)*rad];
    const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);
    segs+=`<path d="M${x0} ${y0} A${R} ${R} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${big} 0 ${x3} ${y3} Z"
      fill="var(--c${(i%6)+1})" opacity=".92"><title>${esc(it.name)} ${fmt(it.value)} (${(frac*100).toFixed(1)}%)</title></path>`;
    a0=a1;});
  const legend=items.map((it,i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;padding:2.5px 0">
      <i style="width:9px;height:9px;border-radius:3px;background:var(--c${(i%6)+1});flex:none"></i>
      <span style="flex:1;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</span>
      <b class="num" style="font-weight:600">${fmt(it.value,{compact:true})}</b>
      <span style="color:var(--ink-faint);width:38px;text-align:right">${total>0?(it.value/total*100).toFixed(0):0}%</span></div>`).join("");
  return `<div style="display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center">
    <svg class="viz" style="width:190px" viewBox="0 0 ${W} ${H}">${segs}
      <text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-family:var(--serif);font-size:17px;fill:var(--ink)">${centerLabel}</text>
      <text x="${cx}" y="${cy+14}" text-anchor="middle" class="ax">${esc(centerSub)}</text></svg>
    <div>${legend}</div></div>`;
}

function renderExpenseCats(){

      The monthly total is still ${rec?fmt(rec.expense):"—"}.</div></div>`; return;}
  const W=430,H=250,pl=104,pr=54,pt=10,pb=28;
  const max=Math.max(...rows.map(r=>r.amount))*1.02||1, bh=(H-pt-pb)/rows.length, gap=Math.min(9,bh*.32);
  const bars=rows.map((r,i)=>{const y=pt+i*bh, w=(r.amount/max)*(W-pl-pr);
    return `<g><text class="axt" x="${pl-8}" y="${y+bh/2+3.5}" text-anchor="end">${esc(r.name)}</text>
      <rect x="${pl}" y="${y+gap/2}" width="${Math.max(w,1.5)}" height="${bh-gap}" rx="4" fill="var(--c${(i%6)+1})" opacity=".92">
      <title>${esc(r.name)} ${fmt(r.amount,{cents:true})}</title></rect>
      <text class="ax" x="${pl+w+7}" y="${y+bh/2+3.5}">${fmt(r.amount)}</text></g>`;}).join("");
  const total=rows.reduce((a,r)=>a+r.amount,0);
  host.innerHTML=`<div class="sec-head"><h2>Expenses by category</h2>
      <span class="hint">${MONFULL[miM(rec.idx)]} ${miY(rec.idx)} · ranked</span></div>
    <svg class="viz" viewBox="0 0 ${W} ${H}">${bars}
      <line x1="${pl}" y1="${H-pb+2}" x2="${W-pr}" y2="${H-pb+2}" stroke="var(--line)"/>
      <text class="ax" x="${pl}" y="${H-pb+16}">$0</text>
      <text class="ax" x="${W-pr}" y="${H-pb+16}" text-anchor="end">${fmt(max,{compact:true})}</text></svg>
    <div style="font-size:11.5px;color:var(--ink-faint);margin-top:4px">
      Top line is ${(rows[0].amount/total*100).toFixed(0)}% of the month's ${fmt(total)}.</div>`;
}

function renderAsk(){
  $("#p-ask").innerHTML=`<div class="sec-head"><h2>What can I do?</h2>
      <span class="hint">computed from your figures · preview an option on the map before acting</span></div>
    <div class="ask-box"><input class="ask-input" id="ask" autocomplete="off"
      placeholder="I have $5,000 available. What should I do with it?">
      <button class="btn primary ask-go" id="ask-go">Ask</button></div>
    <div class="ask-suggest" id="sugg"></div><div class="options" id="ask-out"></div>`;
  const sg=["I have $5,000 available. What should I do with it?","Can I afford a $4,000 trip?",
            "What happens if renovation costs $10k more?","Can I hit all three goals on time?"];
  $("#sugg").innerHTML=sg.map(s=>`<button class="sugg">${esc(s)}</button>`).join("");
  $$("#sugg .sugg").forEach(b=>b.onclick=()=>{$("#ask").value=b.textContent; ask();});
  $("#ask-go").onclick=ask; $("#ask").onkeydown=e=>{if(e.key==="Enter") ask();};
}
function parseAsk(q){
  const s=q.toLowerCase();
  const m=s.replace(/,/g,"").match(/\$?\s*(\d+(?:\.\d+)?)\s*(k\b)?/);
  let amount=m?parseFloat(m[1])*(m[2]?1000:1):null;
  if(amount!=null&&amount<100&&!/\bk\b/.test(s)) amount=null;
  const goal=M.goals.find(g=>s.includes(g.name.toLowerCase()));
  if(/afford|trip|holiday|buy|spend/.test(s)) return {kind:"afford",amount,goal};
  if(/costs? more|more expensive|overrun|goes up/.test(s)) return {kind:"overrun",amount,goal};
  if(/on time|all three|hit all|can i hit/.test(s)) return {kind:"feasible",amount,goal};
  return {kind:"deploy",amount,goal};
}
function ask(){const q=$("#ask").value.trim(); if(q) renderAskResults(buildOptions(parseAsk(q),q));}

function buildOptions(intent,q){
  const pr=project(), plan=pr.plan, opts=[];
  const surplus=pr.net-plan.cashPerMonth-plan.loanPerMonth;
  const mk=(t,w,i,tr,p)=>opts.push({title:t,why:w,impacts:i,tradeoff:tr,preview:p});
  const soonest=plan.rows.slice().sort((a,b)=>a.due-b.due)[0];
  const biggest=plan.rows.slice().sort((a,b)=>b.amt-a.amt)[0];

  /* No goals attributed to this person — every branch below reasons about a
     goal, so answer the question honestly instead of inventing one. */
  if(!plan.rows.length){
    mk(`No goals sit on ${esc(M.scope.person)}'s tab`,
      `Goals are household-scale and are held once, on the shared <b>Goals</b> tab, costed against combined income. Nothing here claims a share of them, so there is no trade-off on this tab to weigh.${
        M.isPlaceholder?` The ledger is empty too, until the source sheet is named — so there is no spending pattern to reason from yet.`:""}`,
      [["Cash / mo",pr.net,pr.net<0?"bad":"good"],["Goals",0,"neutral"],
       ["Liquidity",pr.net,pr.net<0?"bad":"good"],["Timeline",0,"neutral"]],
      M.isPlaceholder?`Any answer here would be built on an assumed spending pattern rather than a recorded one.`
                     :`Ask this on the Combined tab, where both incomes are counted against the goals.`,null);
    return opts;
  }

  if(intent.kind==="feasible"||intent.kind==="deploy"&&!intent.amount){
    mk("The plan needs "+fmt(plan.cashPerMonth)+"/month in cash",
      `${plan.rows.map(r=>esc(r.g.name)+" "+fmt(r.cashPerMonth)).join(", ")}${plan.loanPerMonth?`, plus ${fmt(plan.loanPerMonth)} to your mum`:""}. Against ${fmt(pr.net)} of monthly net that leaves <b>${fmt(surplus,{signed:true})}</b>.`,
      [["Cash / mo",surplus,surplus<0?"bad":"good"],["Goals",0,"neutral"],["Liquidity",surplus,surplus<0?"bad":"good"],["Timeline",0,"neutral"]],
      surplus<0?`The gap is ${fmt(Math.abs(surplus))}/month. Something has to move: a date, an amount, or Melissa's income joining the projection.`:null,null);
    if(soonest) mk(`${soonest.g.name} is the binding constraint`,
      `${fmt(soonest.amt)} in ${soonest.months} months is ${fmt(soonest.cashPerMonth)}/month on its own — ${pr.net>0?Math.round(soonest.cashPerMonth/pr.net*100)+"% of your entire net":"more than your entire net"}. It lands before anything else and consumes the runway the others need.`,
      [["Cash / mo",-soonest.cashPerMonth,"bad"],["Goals",soonest.amt,"good"],["Liquidity",-soonest.cashPerMonth,"warn"],["Timeline",0,"neutral"]],
      `Pushing it out is the single biggest lever — drag it on the map to see how far.`,null);
    if(plan.cpfAvail==null) mk("Enter your CPF balance before deciding anything",
      `BTO is ${fmt(plan.rows.find(r=>r.g.key==="bto")?.amt)} and is meant to draw CPF first. With no CPF balance recorded it is being counted as <b>100% cash</b>, which is the worst case. The real cash requirement is almost certainly lower.`,
      [["Cash / mo",0,"neutral"],["Goals",0,"neutral"],["Liquidity",0,"good"],["Timeline",0,"neutral"]],
      `Until then every number on this page overstates the cash you need.`,null);
  }
  else if(intent.kind==="afford"&&intent.amount){
    const amt=intent.amount;
    mk(surplus>0?`Affordable — it costs ${Math.ceil(amt/surplus)} month${Math.ceil(amt/surplus)===1?"":"s"} of surplus`:"Not affordable without moving a goal",
      surplus>0?`After every goal contribution you keep ${fmt(surplus)}/month. ${fmt(amt)} is ${(amt/surplus).toFixed(1)}× that.`
               :`Your goals already need ${fmt(plan.cashPerMonth+plan.loanPerMonth)}/month against ${fmt(pr.net)} of net. There is no surplus for ${fmt(amt)} — it would come straight out of a goal.`,
      [["Cash now",-amt,"bad"],["Goals",surplus>0?0:-amt,surplus>0?"neutral":"bad"],["Liquidity",-amt,"warn"],["Timeline",0,"neutral"]],
      cashBalance()==null?"No cash balance entered, so this can't be checked against what you actually hold.":null,
      {label:q.slice(0,22),amount:amt,month:M.today});
    if(soonest) mk(`Delay it until after ${soonest.g.name}`,
      `${soonest.g.name} clears ${miLong(soonest.due)}. After that ${fmt(soonest.cashPerMonth)}/month frees up and ${fmt(amt)} takes ${Math.ceil(amt/Math.max(soonest.cashPerMonth,1))} months to rebuild.`,
      [["Cash now",0,"good"],["Goals",0,"good"],["Liquidity",0,"good"],["Timeline",-amt,"warn"]],
      `${Math.max(0,soonest.due-M.today)} months of waiting.`,null);
    mk("Take it from the emergency fund",
      `The floor is ${fmt(M.ef?.amount)} — two months of combined take-home. Dropping ${fmt(amt)} leaves ${fmt((M.ef?.amount||0)-amt)}, i.e. ${(((M.ef?.amount||0)-amt)/(M.salary.takeHome||1)).toFixed(1)} months of cover.`,
      [["Cash now",-amt,"warn"],["Goals",0,"neutral"],["Liquidity",-amt,"bad"],["Timeline",0,"neutral"]],
      `The emergency fund is the only thing standing between a bad month and a missed goal.`,null);
  }
  else{
    const g=intent.goal?plan.rows.find(r=>r.g.key===intent.goal.key):plan.rows.find(r=>/renovation/i.test(r.g.name))||biggest;
    const bump=intent.amount||10000;
    mk("Absorb it",
      `${g.g.name} rises from ${fmt(g.amt)} to ${fmt(g.amt+bump)} — ${fmt((g.amt+bump)/g.months)}/month instead of ${fmt(g.cashPerMonth)}. That is ${fmt(bump/g.months)}/month more out of a ${fmt(surplus,{signed:true})} surplus.`,
      [["Cash / mo",-bump/g.months,"bad"],["Goals",-bump,"warn"],["Liquidity",-bump,"warn"],["Timeline",0,"neutral"]],
      surplus-bump/g.months<0?`This pushes you ${fmt(Math.abs(surplus-bump/g.months))}/month underwater.`:null,
      {label:g.g.name+" +"+fmt(bump,{compact:true}),amount:bump,month:Math.max(g.due,M.today)});
    mk("Push the date",
      `Hold the contribution and move ${g.g.name} later. ${g.g.hardDeadline?"⚠ This one has a hard deadline — it can't move without consequence.":"It has no hard deadline, so this is the cheapest lever you have."}`,
      [["Cash / mo",0,"good"],["Goals",0,"neutral"],["Liquidity",0,"good"],["Timeline",-bump,g.g.hardDeadline?"bad":"warn"]],
      g.g.hardDeadline?`${g.g.name} is fixed to ${miLong(g.due)}.`:null,null);
    mk("Trim the amount instead",
      `Cut ${g.g.name} by ${fmt(bump)} and the schedule is unchanged. Adjust it directly with the goal controls on the Goals tab.`,
      [["Cash / mo",0,"good"],["Goals",-bump,"warn"],["Liquidity",0,"neutral"],["Timeline",0,"good"]],
      `Only you can say whether ${fmt(g.amt-bump)} still buys what you want.`,null);
  }
  return opts.slice(0,3);
}

function renderBrief(){
  const host=$("#p-brief"); if(!host) return;
  const pr=project(), plan=pr.plan;
  const surplus=pr.net-plan.cashPerMonth-plan.loanPerMonth;
  const items=[]; const push=(tone,icon,title,desc)=>items.push({tone,icon,title,desc});

  if(surplus<0) push("clay","!","The plan does not fit the income",
    `Your three goals need <b>${fmt(plan.cashPerMonth)}/month</b> in cash${plan.loanPerMonth?`, plus <b>${fmt(plan.loanPerMonth)}</b> to your mum`:""}, against <b>${fmt(pr.net)}</b> of monthly net. That is a <b>${fmt(Math.abs(surplus))}/month</b> gap. ${S.includeMelissa?"":`Melissa's ${fmt(M.proj.melissaMonthly)} take-home is not in this projection — adding it closes ${fmt(Math.min(Math.abs(surplus),M.proj.melissaMonthly||0))} of it.`}`);
  else push("pine","$","The plan fits, with room",
    `After every goal contribution and the loan repayment you keep <b>${fmt(surplus)}/month</b>.`);

  const soon=plan.rows.slice().sort((a,b)=>a.due-b.due)[0];
  if(soon) push("clay","▲",`${soon.g.name} is the binding constraint`,
    `<b>${fmt(soon.amt)}</b> by <b>${miLong(soon.due)}</b> — ${soon.months} months away, so <b>${fmt(soon.cashPerMonth)}/month</b>. It is the earliest and steepest claim; everything else queues behind it.`);

  const bto=plan.rows.find(r=>r.g.key==="bto");
  if(bto){
    if(bto.cpfUnknown) push("clay","?","BTO is being costed as all cash",
      `<b>${fmt(bto.amt)}</b> by ${miLong(bto.due)} is meant to draw CPF first. No CPF balance is recorded, so it is showing as <b>100% cash</b> — the worst case. Enter both CPF balances and this number will fall.`);
    else push("pine","◆","BTO splits CPF first, then cash",
      `<b>${fmt(bto.cpfPart)}</b> from CPF and <b>${fmt(bto.cashPart)}</b> from cash, on ${fmt(plan.cpfAvail)} of CPF today plus ${fmt(plan.monthlyCPF)}/month accruing to ${miLong(bto.due)}. Assumes the balance you entered is usable for housing.`);
  }

  const ef=M.ef;
  if(ef){
    const cash=cashBalance();
    push(cash==null?"grey":(cash>=ef.amount?"pine":"clay"), "◇", "Emergency fund floor",
      `<b>${fmt(ef.amount)}</b> — ${ef.months} months of combined take-home, held in cash. ${cash==null?"No cash balance entered, so it can't be checked.":cash>=ef.amount?`Your ${fmt(cash)} cash covers it with ${fmt(cash-ef.amount)} to spare.`:`Your ${fmt(cash)} cash is <b>${fmt(ef.amount-cash)} short</b> of it. This is not a goal you can defer — it is the floor.`}`);
  }

  const sl=M.liabilities.find(l=>l.repayIdx!=null);
  if(sl) push("pine","→",`${sl.name} amortises from ${miLong(sl.repayIdx)}`,
    `<b>${fmt(sl.outstanding)}</b> to your mum, falling ${fmt(sl.repayMonthly)}/month — clear in <b>${Math.ceil(sl.outstanding/sl.repayMonthly)} months</b>, ${miLong(sl.repayIdx+Math.ceil(sl.outstanding/sl.repayMonthly)-1)}. Cash out but net-worth neutral, so the line doesn't dip for it.`);

  const done=M.months.filter(m=>!m.partial);
  if(done.length>=3) push("grey","⌁","What the trailing spend is built on",
    `Expenses run at <b>${fmt(pr.B.expense)}/month</b> on the last three complete months (${done.slice(-3).map(m=>MON[miM(m.idx)]+" "+fmt(m.expense,{compact:true})).join(", ")}). July carried ${fmt(M.expenseCats[0]?.amount)} of ${esc(M.expenseCats[0]?.name||"")}, so this basis is high — one clean month will move it.`);

  (M.raw.decisions||[]).forEach(x=>push("pine","→",esc(x.name),esc(x.detail)));

  const T={clay:"var(--clay)",pine:"var(--pine)",grey:"var(--ink-faint)"};
  host.innerHTML=`<div class="sec-head"><h2>Finance brief</h2>
      <span class="hint">decisions ahead of statistics</span></div>
    ${items.map(it=>`<div class="bitem">
      <div class="bi" style="background:${it.tone==="clay"?"var(--clay-soft)":it.tone==="pine"?"var(--pine-soft)":"var(--paper-2)"};color:${T[it.tone]}">${it.icon}</div>
      <div><div class="bt" style="color:${T[it.tone]}">${it.title}</div><div class="bd">${it.desc}</div></div></div>`).join("")}`;
}

function drawConstellation(){
  const svg=$("#const"); if(!svg) return;
  const cx=310,cy=250,R0=96,RSPAN=112;
  const plan=fundingPlan(), nowM=M.today+S.cursor;
  const maxAmt=Math.max(...plan.rows.map(r=>r.amt),1);
  const rem=r=>r.due-nowM, maxRem=Math.max(6,...plan.rows.map(r=>Math.max(0,rem(r))));
  const orbitR=r=>{const x=rem(r); return x<=0?R0:R0+(Math.min(x,maxRem)/maxRem)*RSPAN;};
  const rings=[0,.5,1].map(f=>`<circle class="orbit" cx="${cx}" cy="${cy}" r="${R0+f*RSPAN}"/>`).join("");

  const nodes=plan.rows.map((r,i)=>{
    const a=(-Math.PI/2)+(i/plan.rows.length)*Math.PI*2, R=orbitR(r);
    const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R;
    const rad=17+Math.sqrt(r.amt/maxAmt)*23;
    const col=r.g.hardDeadline?"var(--clay)":"var(--caramel)";
    const funded=fundedAt(r,nowM), frac=clamp(funded/r.amt,0,1), C=2*Math.PI*(rad+6);
    return `<g class="goal-node ${S.selectedGoal===r.g.key?"sel":""}" data-goal="${r.g.key}" style="animation:rise .5s ${i*70}ms both">
      <circle class="halo" cx="${x}" cy="${y}" r="${rad+18}" fill="${col}"/>
      <line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${col}" stroke-opacity=".18"/>
      <circle cx="${x}" cy="${y}" r="${rad}" fill="${col}" fill-opacity=".13" stroke="${col}" stroke-opacity=".5"/>
      ${frac>0.002?`<circle cx="${x}" cy="${y}" r="${rad+6}" fill="none" stroke="${col}" stroke-width="3"
              stroke-dasharray="${(frac*C).toFixed(1)} ${C}" stroke-linecap="round" transform="rotate(-90 ${x} ${y})"/>`
        :`<circle cx="${x}" cy="${y}" r="${rad+6}" fill="none" stroke="var(--line)" stroke-width="1"
              stroke-dasharray="2 5" opacity=".8"/>`}
      <text class="goal-name" x="${x}" y="${y+1}">${esc(r.g.name)}</text>
      <text class="goal-sub" x="${x}" y="${y+14}">${fmt(r.amt,{compact:true})}</text></g>`;}).join("");

  const ef=M.ef, cash=cashBalance();
  const efOk=cash!=null&&ef&&cash>=ef.amount;
  const efFrac=(ef&&cash!=null)?clamp(cash/ef.amount,0,1):0, efR=52, efC=2*Math.PI*efR;
  svg.innerHTML=`${rings}
    <circle cx="${cx}" cy="${cy}" r="${efR}" fill="var(--paper-2)" stroke="var(--line)"/>
    <circle cx="${cx}" cy="${cy}" r="${efR}" fill="none" stroke="${efOk?"var(--pine)":"var(--clay)"}"
            stroke-width="4" stroke-dasharray="${(efFrac*efC).toFixed(1)} ${efC}" stroke-linecap="round"
            transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy-10}" class="goal-sub" style="font-size:9px;letter-spacing:.08em">EMERGENCY FUND</text>
    <text x="${cx}" y="${cy+6}" class="goal-name" style="font-size:15px;font-family:var(--serif);font-weight:500">${fmt(ef?.amount,{compact:true})}</text>
    <text x="${cx}" y="${cy+20}" class="goal-sub">${cash==null?"cash not set":(efOk?"covered":fmt(ef.amount-cash)+" short")}</text>
    <text class="orbit-label" x="${cx+R0+6}" y="${cy-5}">sooner</text>
    <text class="orbit-label" x="${cx+R0+RSPAN-26}" y="${cy-5}">later</text>
    ${nodes}`;
  $$(".goal-node",svg).forEach(n=>n.onclick=()=>{S.selectedGoal=n.dataset.goal; drawConstellation(); renderGoalDetail();});
  renderGoalDetail();
}

function renderGoalDetail(){
  const host=$("#goal-detail"); if(!host) return;
  const plan=fundingPlan(), r=plan.rows.find(x=>x.g.key===S.selectedGoal);
  const pr=project();
  if(!r){
    const ef=M.ef, cash=cashBalance();
    host.innerHTML=`<div style="font-family:var(--serif);font-size:20px;font-weight:500;margin-bottom:6px">Emergency fund</div>
      <span class="chip ${cash!=null&&ef&&cash>=ef.amount?"pine":"clay"}">${cash==null?"cash balance not set":(cash>=ef.amount?"covered":"short")}</span>
      <div style="margin-top:12px">
        <div class="drow"><span class="l">Required</span><span class="v num">${fmt(ef?.amount)}</span></div>
        <div class="drow"><span class="l">Basis</span><span class="v">${ef?.months} months of combined take-home</span></div>

      <div class="drow"><span class="l">Required per month</span><span class="v num" style="color:var(--clay-deep)">${fmt(r.perMonth)}</span></div>
      ${r.usesCPF?`<div class="drow"><span class="l">From CPF</span><span class="v num">${r.cpfUnknown?'<span class="unk">balance needed</span>':fmt(r.cpfPart)}</span></div>
      <div class="drow"><span class="l">From cash</span><span class="v num">${fmt(r.cashPart)}</span></div>`

      <div class="drow"><span class="l">On schedule at ${miLabel(nowM)}</span><span class="v num">${fmt(funded)}</span></div>
      <div class="drow"><span class="l">Share of monthly net</span><span class="v num">${pr.net>0?Math.round(r.cashPerMonth/pr.net*100)+"%":'<span class="unk">no net to draw on</span>'}</span></div>
      <div class="drow"><span class="l">Paid by</span><span class="v">${(r.g.payers||[]).join(" &amp; ")}</span></div>

      ${esc(r.g.note||"")} ${r.cpfUnknown?"CPF balances are blank, so this is costed as 100% cash — the worst case.":""}

function renderGoalEditors(){
  const host=$("#goal-edit"); if(!host) return;

  host.innerHTML=plan.rows.map(r=>`
    <div class="ge">
      <div class="gh"><span class="gn">${esc(r.g.name)}</span>
        ${(r.g.fundedBy||[]).map(s=>`<span class="src-tag src-${s}">${s.toUpperCase()}</span>`).join(" ")}</div>
      <div class="stepper">
        <button data-step="-5000" data-goal="${r.g.key}" aria-label="Decrease ${esc(r.g.name)}">−</button>
        <input type="number" data-amt="${r.g.key}" step="1000" min="0" value="${r.amt}">
        <button data-step="5000" data-goal="${r.g.key}" aria-label="Increase ${esc(r.g.name)}">+</button>
      </div>
      <div class="gm">Due <b>${miLong(r.due)}</b> · ${r.months} months →
        <b>${fmt(r.perMonth)}/mo</b>${r.usesCPF&&!r.cpfUnknown?` (cash ${fmt(r.cashPerMonth)}/mo)`:""}
        ${S.goalAmt[r.g.key]!=null?`<br><span style="color:var(--pine-deep)">edited from ${fmt(r.g.amount)}</span>`:""}</div>
    </div>`).join("")
    +`<div class="ge" style="background:var(--paper);border-style:dashed">
      <div class="gh"><span class="gn">Emergency fund</span><span class="src-tag src-cash">CASH</span></div>
      <div style="font-family:var(--serif);font-size:22px">${fmt(M.ef?.amount)}</div>
      <div class="gm">Not a goal and not editable here — it is <b>${M.ef?.months} months of combined take-home</b>
        (${fmt(M.salary.takeHome)}), so it moves only when salary does.</div></div>`;

  $$("[data-amt]").forEach(inp=>inp.oninput=e=>{
    const k=e.target.dataset.amt, v=e.target.value;
    if(v===""){delete S.goalAmt[k]; queueSave({unsetGoalAmt:[k]});}
    else {S.goalAmt[k]=Math.max(0,+v); queueSave({goalAmt:{[k]:S.goalAmt[k]}});}
    refreshGoals();});
  $$("[data-step]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.goal, g=M.goals.find(x=>x.key===k);
    const cur=goalAmount(g), next=Math.max(0,cur+ +b.dataset.step);
    S.goalAmt[k]=next; queueSave({goalAmt:{[k]:next}}); refreshGoals();});
  renderPlanSummary();
}

/* ================= 12. FAQ ================= */
function renderFAQ(){
  const d=M.raw;
  $("#view-faq").innerHTML=`
    <div class="faq-hero">
      <h1>What the Finance Intern actually does</h1>
      <p>It is a reporting and decision layer, not a bank. It reads one spreadsheet, keeps one honest picture of
      where the money is going, and tells Joseph and Melissa what decision is in front of them this month. It has
      no access to any account, moves no money, and invents no figures.</p>
    </div>
    <div class="faq-grid">
      <div class="card pad">
        <h2 class="faq-q">What it exists to do</h2>
        <div class="faq-a">Three jobs, in order of importance:
          <ul>
            <li><b>Show the real position.</b> Net worth, what's owed, what's coming.</li>
            <li><b>Turn goals into a schedule.</b> BTO, Wedding and Renovation each have an amount and a date;
                the Intern derives what that costs per month and whether the income covers it.</li>
            <li><b>Name the decision.</b> Not "you spent $4,543 on travel" but "travel was 91% of the month —
                this is the number to move."</li>
          </ul>
          It is deliberately not a budgeting app. It won't nag about coffee. It answers one question:
          <b>can we afford what we've committed to, and if not, what moves?</b></div>
      </div>
      <div class="card pad">
        <h2 class="faq-q">Where the data comes from</h2>
        <div class="faq-a">
          One source only — the Google Sheet <b>My Income &amp; Expenses</b>, and within it only two tabs:
          <ul>
            <li><b>Annual Overview</b> — monthly income, expenses and cash flow.</li>
            <li><b>Monthly Overview</b> — the category split for whichever month the sheet is set to.</li>
          </ul>
          <b>January 2026 onwards.</b> Nothing earlier is carried. The Monthly Budget tab is no longer read
          and never will be again.
          <br><br>Everything else — salary, CPF, goal amounts and dates, the school loan — is a figure Joseph
          confirmed directly, recorded in <code>data/finance.json</code> with the date it was confirmed.
          If a number isn't in one of those two places, the Intern shows it as unknown rather than guessing.</div>
      </div>
      <div class="card pad">
        <h2 class="faq-q">How it takes orders from Steven</h2>
        <div class="faq-a">
          Steven is the executive agent. The Finance Intern is one of its specialists and never talks to Joseph
          directly — every request and every answer routes through Steven.
          <div class="flow">
            <span class="n">Joseph asks</span><span class="ar">→</span>
            <span class="n dark">Steven</span><span class="ar">→</span>
            <span class="n clay">Finance Intern</span><span class="ar">→</span>
            <span class="n dark">Steven</span><span class="ar">→</span>
            <span class="n">one answer</span>
          </div>
          Steven decides which life area a request belongs to and loads only that memory. Finance questions come
          here; investment questions go elsewhere. When two sources disagree, the Intern flags the conflict to
          Steven and stops — it does not quietly pick a winner or edit the losing file.</div>
      </div>
      <div class="card pad">
        <h2 class="faq-q">The monthly routine</h2>
        <div class="faq-a">
          <ul>
            <li><b>Joseph logs</b> income and expenses in the sheet as they happen. From Aug 2026 the salary is
                assumed — only income <i>beyond</i> the ${fmt(M.joseph.takeHome)} take-home needs entering.</li>
            <li><b>On the 25th</b>, the figures are pulled from the two overview tabs into
                <code>data/finance.json</code>. That file is the only thing that changes month to month.</li>
            <li><b>Push, and it's live</b> in about forty seconds.</li>
            <li><b>The brief regenerates</b> from the new figures — the schedule, the shortfall and the
                binding constraint all recompute.</li>
          </ul></div>
      </div>
      <div class="card pad">
        <h2 class="faq-q">How the goal schedule works</h2>
        <div class="faq-a">
          Nothing about the funding plan is stored. Each goal has an amount and a date, and the required
          contribution is <b>amount ÷ months remaining</b>, recalculated every time the page loads.
          <ul>
            <li><b>BTO</b> ${fmt(goalAmount(M.goals.find(g=>g.key==="bto")||{}))} by ${miLong(parseWhen("2028-03"))} — hard deadline, CPF first then cash.</li>
            <li><b>Wedding</b> ${fmt(goalAmount(M.goals.find(g=>g.key==="wedding")||{}))} by ${miLong(parseWhen("2027-06"))} — cash only.</li>
            <li><b>Renovation</b> ${fmt(goalAmount(M.goals.find(g=>g.key==="renovation")||{}))} by ${miLong(parseWhen("2028-06"))} — cash only.</li>
            <li><b>School loan</b> ${fmt(M.liabilities.find(l=>l.repayIdx!=null)?.outstanding)} to Joseph's mum,
                ${fmt(1000)}/month from Sep 2026 — a liability, not a goal.</li>
            <li><b>Emergency fund</b> ${fmt(M.ef?.amount)} in cash — not a goal, a floor that is always there.</li>
          </ul>
          Change an amount on the Goals tab or drag a date on the cash map and the whole schedule re-derives.</div>
      </div>
      <div class="card pad">
        <h2 class="faq-q">What it will never do</h2>
        <div class="faq-a">
          <ul>
            <li><b>Invent a number.</b> If a balance isn't recorded it shows "not set", never zero.</li>
            <li><b>Move money.</b> It has no account access and cannot transact.</li>
            <li><b>Give investment advice.</b> That is a different specialist, and neither is a licensed adviser.</li>
            <li><b>Silently resolve a conflict.</b> Two sources disagreeing is surfaced, not averaged.</li>
            <li><b>Overwrite what you typed.</b> Balances entered on this page stay in your browser
                until you deliberately export them.</li>
          </ul>
          It also cannot see your bank. Everything it knows, one of you typed into the sheet.</div>
      </div>
    </div>`;
}

/* Only the mounted tab's panels exist, so every step is guarded on its host. */
function refreshExceptFill(){
  if($("#kpis")){
    renderKPIs(); drawChart(); renderScenarioBar();
    renderAssets(); renderLiabilities(); renderExpenseCats(); renderBrief();
  }
  if($("#const")){drawConstellation(); renderPlanSummary();}
}
function refresh(){refreshExceptFill(); if($("#p-bars")) renderBars();}
function refreshGoals(){drawConstellation(); renderGoalEditors(); refreshExceptFill();}

async function boot(dJoseph,dMelissa){
  const combinedRaw=buildCombinedRaw(dJoseph,dMelissa);
  SCOPES.joseph  ={raw:dJoseph,   model:buildModel(dJoseph),   opts:{brief:true}};
  SCOPES.melissa ={raw:dMelissa,  model:buildModel(dMelissa),  opts:{brief:true}};
  SCOPES.combined={raw:combinedRaw,model:buildModel(combinedRaw),opts:{brief:false}};
  ORDER.forEach(id=>registerFields(SCOPES[id].model));

  M=SCOPES.joseph.model;
  renderShell();
  await loadState();               // server is authoritative; falls back to this device
  mountPerson("joseph");
  addEventListener("resize",drawTicks);
  addEventListener("focus",syncOnFocus);
  addEventListener("beforeunload",()=>{if(!pendingEmpty(SYNC.pending)) flushSave();});
  whoami();
}
async function whoami(){
  try{
    const r=await fetch("/cdn-cgi/access/get-identity",{credentials:"include"});
    if(!r.ok) return;
    const id=await r.json();
    if(id&&id.email){
      const w=$("#who"); if(w) w.textContent="Signed in as "+id.email;
    }
  }catch(_){}
}
/* Sign out — clears the session cookie server-side, then reloads into the
   PIN screen. The cookie is HttpOnly, so only the server can clear it. */
async function signOut(){
  try{ await fetch("/__auth/logout",{method:"POST",credentials:"same-origin"}); }catch(_){}
  location.replace("/");
}

const grab=p=>fetch(p,{cache:"no-store"})
  .then(r=>{if(!r.ok) throw new Error(p+" → HTTP "+r.status); return r.json();});

Promise.all([grab("data/finance.json"),grab("data/finance-melissa.json")])
  .then(([j,m])=>boot(j,m))
  .catch(e=>{$("#root").innerHTML=
    `<div class="card pad"><div class="sec-head"><h2 style="color:var(--clay-deep)">⚠ Could not load the data files</h2></div>
     <div style="font-size:13px;color:var(--ink-soft)">${esc(e.message)}</div></div>`;});
</script>
