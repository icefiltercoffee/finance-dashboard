/* ================= 8c. EXECUTE ======================================
   Two different jobs live behind one input box, deliberately split:

   - Anything that WRITES shared state — a balance, a goal amount, a tab
     switch — goes through a real command parser below, not a model. It
     recognises a defined set of instruction shapes, does exactly what they
     say, and says plainly when it does not understand. A mutation to a
     dashboard everyone shares should never be a probabilistic guess.
   - Anything that's a genuine QUESTION and isn't recognised as one of those
     instructions is handed to an LLM (see askSteven()) grounded in a JSON
     snapshot of exactly what's on screen — so it can actually reason about
     what was asked instead of force-fitting it into a handful of templates.
     If that call fails, it falls back to the old deterministic templates
     rather than going silent.

   Writes are previewed before they apply, and can be undone straight
   afterwards. View changes and questions both happen at once. */

const EXEC={pending:null, undo:null};

/** The amount in an instruction. Prefers the number after "to", "by", "=" or
 *  "$", because that is where the figure actually goes — a plain
 *  last-number-wins rule reads "by 2000" and "to 2026" as years, or picks up a
 *  stray digit from elsewhere in the sentence. */
function amountFrom(s){
  let m=String(s).match(/(?:\bto\b|\bby\b|\bwith\b|=|\$)\s*\$?\s*(\d[\d,]*(?:\.\d+)?)\s*([km])?\b/i);
  if(!m) m=String(s).match(/(\d[\d,]*(?:\.\d+)?)\s*([km])?\b/i);
  if(!m) return null;
  let n=parseFloat(m[1].replace(/,/g,""));
  if(!isFinite(n)) return null;
  const suf=(m[2]||"").toLowerCase();
  if(suf==="k") n*=1e3; else if(suf==="m") n*=1e6;
  return n;
}
const BAL_KEY={
  joseph :{cash:"cashJoseph", inv:"invJoseph", cpfOa:"cpfOaJoseph"},
  melissa:{cash:"cashMelissa",inv:"invMelissa",cpfOa:"cpfOaMelissa"},
  combined:{cash:"cashCombined",inv:"invCombined",cpfOa:"cpfOaCombined"}
};
const PERSON_LABEL={joseph:"Joseph",melissa:"Melissa",combined:"Combined"};

function personFrom(s,fallback){
  if(/\b(combined|joint|household|both of us)\b/.test(s)) return "combined";
  if(/\b(melissa|mel|her|hers)\b/.test(s)) return "melissa";
  if(/\bjoseph\b|\bjoe\b/.test(s)) return "joseph";
  return fallback;                       // "my"/"our" means the tab you are on
}
function balKindFrom(s){
  if(/\bcpf\b|\boa\b/.test(s)) return "cpfOa";
  if(/invest|stock|portfolio|shares?\b|equit/.test(s)) return "inv";
  if(/\bcash\b|\bsavings?\b|\bbank\b/.test(s)) return "cash";
  return null;
}
function goalFrom(s){
  const goals=SCOPES.combined?.model.goals||M.goals||[];    // goals are household
  return goals.find(g=>{
    const n=(g.name||"").toLowerCase();
    if(n&&s.includes(n)) return true;
    if(g.key==="bto"&&/\bbto\b|\bflat\b|\bhdb\b/.test(s)) return true;
    if(g.key==="renovation"&&/\breno\b/.test(s)) return true;
    return false;
  })||null;
}
function verbFrom(s){
  if(/\b(clear|reset|unset|blank|wipe)\b/.test(s)) return "clear";
  if(/\b(add|increase|raise|bump|top ?up|plus|grow)\b/.test(s)) return "add";
  if(/\b(reduce|decrease|lower|cut|subtract|minus|drop|shrink)\b/.test(s)) return "sub";
  if(/\b(set|update|change|make|put|record|log|enter|correct)\b/.test(s)) return "set";
  return null;
}
const MONTH_WORD=/\b(jan(uary)?|feb(ruary)?|mar(ch)?|apr(il)?|may|jun(e)?|jul(y)?|aug(ust)?|sep(t|tember)?|oct(ober)?|nov(ember)?|dec(ember)?)\b/;

/** One clause -> one action, or null if it isn't an instruction. */
function parseClause(raw){
  const s=raw.toLowerCase().replace(/\s+/g," ").trim();
  if(!s) return null;
  const verb=verbFrom(s);

  /* ---- view: cheap and reversible, so it just happens ---- */
  let m;
  if((m=s.match(/\b(joseph|melissa|combined|goals?|faq)\b\s*(tab|view)\b/))
     ||(m=s.match(/^(?:go to|open|switch to|show me|show)\s+(?:the\s+)?(joseph|melissa|combined|goals?|faq)$/))){
    const v=m[1].replace(/^goals?$/,"combined");
    return {type:"view",what:"tab",value:v,label:`Open the ${PERSON_LABEL[v]||v[0].toUpperCase()+v.slice(1)} tab`};
  }
  if((m=s.match(/\b(12|24|36)\s*(?:m|mo|month|months)\b/))&&/horizon|project|forecast|map|show|set/.test(s))
    return {type:"view",what:"horizon",value:+m[1],label:`Set the cash map horizon to ${m[1]} months`};
  if(/\b(include|add|with)\b.*\bmelissa'?s?\b.*\bincome\b/.test(s)||/^include melissa$/.test(s))
    return {type:"view",what:"includeMelissa",value:true,label:"Include Melissa's income in the projection"};
  if(/\b(exclude|remove|without|drop)\b.*\bmelissa'?s?\b.*\bincome\b/.test(s)||/^exclude melissa$/.test(s))
    return {type:"view",what:"includeMelissa",value:false,label:"Exclude Melissa's income from the projection"};
  if((m=s.match(MONTH_WORD))&&/\b(show|view|go to|open|switch)\b/.test(s)&&!/statement/.test(s)){
    const mo=MONTH_ABBR[m[1].slice(0,3)];
    const yr=(s.match(/\b(20\d{2})\b/)||[])[1];
    const key=(yr?+yr:miY(M.today))+"-"+String(mo+1).padStart(2,"0");
    return {type:"view",what:"month",value:key,label:`Show ${MONFULL[mo]} ${yr||miY(M.today)}`};
  }

  /* ---- statements ---- */
  if(/statement/.test(s)&&/\b(delete|remove|clear|wipe|drop)\b/.test(s)){
    const who=personFrom(s,ACTIVE==="combined"?null:ACTIVE);
    if(!who||who==="combined")
      return {type:"error",label:"Statements belong to one person — say whose, e.g. \"delete Joseph's statements\"."};
    const mm=s.match(MONTH_WORD);
    if(mm&&!/\ball\b/.test(s)){
      const mo=MONTH_ABBR[mm[1].slice(0,3)];
      const yr=(s.match(/\b(20\d{2})\b/)||[])[1];
      const key=(yr?+yr:miY(M.today))+"-"+String(mo+1).padStart(2,"0");
      const rec=(S.imports[who]||{})[key];
      if(!rec) return {type:"error",label:`There is no imported statement for ${MONFULL[mo]} ${yr||miY(M.today)} under ${PERSON_LABEL[who]}.`};
      return {type:"stmt",scope:who,month:key,
              label:`Delete ${PERSON_LABEL[who]}'s ${MONFULL[mo]} ${yr||miY(M.today)} statement`,
              detail:`${fmt(rec.total)} · ${rec.count} transaction${rec.count===1?"":"s"}`};
    }
    const n=Object.keys(S.imports[who]||{}).length;
    if(!n) return {type:"error",label:`${PERSON_LABEL[who]} has no imported statements to delete.`};
    return {type:"stmt",scope:who,month:"*",
            label:`Delete all of ${PERSON_LABEL[who]}'s imported statements`,
            detail:`${n} month${n===1?"":"s"}`};
  }

  /* ---- goal amounts ---- */
  const goal=goalFrom(s);
  if(goal&&verb){
    const from=goalAmount(goal);
    if(verb==="clear")
      return {type:"goal",key:goal.key,name:goal.name,from,to:null,
              label:`Reset ${goal.name} to its stated amount`,
              detail:`${fmt(from)} → ${fmt(goal.amount)} (from the source file)`};
    const amt=amountFrom(s);
    if(amt==null) return {type:"error",label:`How much should ${goal.name} change by? e.g. "set ${goal.name.toLowerCase()} to 60k".`};
    const to=verb==="set"?amt:(verb==="add"?from+amt:from-amt);
    if(to<0) return {type:"error",label:`That would put ${goal.name} below zero.`};
    return {type:"goal",key:goal.key,name:goal.name,from,to,
            label:`${verb==="set"?"Set":verb==="add"?"Increase":"Reduce"} ${goal.name}`,
            detail:`${fmt(from)} → ${fmt(to)}`};
  }

  /* ---- balances ---- */
  const kind=balKindFrom(s);
  if(kind&&verb){
    const who=personFrom(s,ACTIVE);
    const key=BAL_KEY[who][kind];
    const label=FIELDS[key]?.label||key;
    const typed=rawBal(key), shown=balVal(key);
    if(verb==="clear")
      return {type:"balance",key,from:typed,to:null,label:`Clear ${label}`,
              detail:typed==null?"it is already not set":`${fmt(typed)} → not set`};
    const amt=amountFrom(s);
    if(amt==null) return {type:"error",label:`What amount? e.g. "set ${label.toLowerCase()} to 12,000".`};
    const base=shown==null?0:shown;
    const to=verb==="set"?amt:(verb==="add"?base+amt:base-amt);
    if(to<0) return {type:"error",label:`That would make ${label} negative.`};
    const note=verb!=="set"&&shown==null?" · was not set, treated as $0"
             :(verb!=="set"&&typed==null&&PARTS[key]?" · based on the sum of both sides":"");
    return {type:"balance",key,from:typed,to,
            label:`${verb==="set"?"Set":verb==="add"?"Increase":"Reduce"} ${label}`,
            detail:`${typed==null?(shown==null?"not set":fmt(shown)+" (sum)"):fmt(typed)} → ${fmt(to)}${note}`};
  }
  return null;
}

function parseCommand(text){
  const parts=text.split(/\s+and\s+|;/i).map(p=>p.trim()).filter(Boolean);
  const actions=parts.map(parseClause);
  if(actions.some(a=>a==null)) return null;              // not an instruction at all
  const err=actions.find(a=>a.type==="error");
  if(err) return {error:err.label};
  return {actions};
}

function execute(){
  const q=$("#ask").value.trim(); if(!q) return;
  const cmd=parseCommand(q);
  if(cmd&&cmd.error){renderExecMessage(cmd.error,true); return;}
  if(cmd&&cmd.actions.length){
    const views=cmd.actions.filter(a=>a.type==="view");
    const writes=cmd.actions.filter(a=>a.type!=="view");
    if(views.length){applyViews(views);}
    if(!writes.length){
      renderExecMessage(views.map(v=>v.label).join(" · ")+" — done.",false);
      return;
    }
    EXEC.pending={actions:writes,query:q,viewsDone:views};
    renderExecPlan();
    return;
  }
  // not an instruction — ask Steven. If the LLM is unreachable, fall back to
  // the deterministic lever templates rather than showing nothing.
  askSteven(q);
}

function applyViews(views){
  views.forEach(v=>{
    if(v.what==="tab"){const t=$$(".tab").find(x=>x.dataset.view===v.value); if(t) t.click();}
    if(v.what==="horizon"){
      S.horizon=v.value; S.cursor=clamp(S.cursor,0,S.horizon);
      const b=$(`#horizon button[data-h="${v.value}"]`); if(b) b.click(); else refresh();
    }
    if(v.what==="includeMelissa"){
      S.includeMelissa=v.value; cacheLocal();
      const c=$("#inc-mel"); if(c) c.checked=v.value;
      renderIntegrity(); refresh();
    }
    if(v.what==="month"){
      if(M.months.some(x=>x.key===v.value)){S.month=v.value; renderMonthPick(); refresh();}
    }
  });
}

function renderExecPlan(){
  const out=$("#ask-out"); if(!out||!EXEC.pending) return;
  const {actions}=EXEC.pending;
  out.innerHTML=`<div class="execbox">
    <div class="exec-h"><span class="chip clay">Not applied yet</span>
      <b>${actions.length} change${actions.length===1?"":"s"} ready</b></div>
    <div class="exec-list">${actions.map(a=>`<div class="exec-row">
      <span class="exec-l">${esc(a.label)}</span>
      <span class="exec-d num">${esc(a.detail||"")}</span></div>`).join("")}</div>
    <div class="exec-note">This writes to the shared dashboard — everyone with the passcode sees it,
      on every device. Nothing has changed yet.</div>
    <div class="exec-actions">
      <button class="btn primary" id="exec-go">Apply</button>
      <button class="btn" id="exec-cancel">Cancel</button></div></div>`;
  $("#exec-cancel").onclick=()=>{EXEC.pending=null; out.innerHTML="";};
  $("#exec-go").onclick=()=>{
    EXEC.undo=applyActions(actions);
    EXEC.pending=null;
    renderMonthPick(); renderFill(); renderStmtPanel($("#stmt-panel")?.dataset.open==="1"); refresh();
    renderExecDone(actions);
  };
}

function applyActions(actions){
  const undo={balances:{},goals:{},imports:null};
  const patch=emptyPatch();
  actions.forEach(a=>{
    if(a.type==="balance"){
      undo.balances[a.key]=S.balances[a.key]!=null?S.balances[a.key]:null;
      if(a.to==null){delete S.balances[a.key]; patch.unset.push(a.key);}
      else {S.balances[a.key]=a.to; patch.set[a.key]=a.to;}
    }else if(a.type==="goal"){
      undo.goals[a.key]=S.goalAmt[a.key]!=null?S.goalAmt[a.key]:null;
      if(a.to==null){delete S.goalAmt[a.key]; patch.unsetGoalAmt.push(a.key);}
      else {S.goalAmt[a.key]=a.to; patch.goalAmt[a.key]=a.to;}
    }else if(a.type==="stmt"){
      undo.imports=undo.imports||JSON.parse(JSON.stringify(S.imports||{}));
      if(a.month==="*"){delete S.imports[a.scope]; patch.unsetImports.push({scope:a.scope,month:"*"});}
      else{if(S.imports[a.scope]) delete S.imports[a.scope][a.month];
           patch.unsetImports.push({scope:a.scope,month:a.month});}
    }
  });
  queueSave(patch);
  applyImports();
  return undo;
}

function revertActions(undo){
  const patch=emptyPatch();
  Object.entries(undo.balances).forEach(([k,v])=>{
    if(v==null){delete S.balances[k]; patch.unset.push(k);} else {S.balances[k]=v; patch.set[k]=v;}});
  Object.entries(undo.goals).forEach(([k,v])=>{
    if(v==null){delete S.goalAmt[k]; patch.unsetGoalAmt.push(k);} else {S.goalAmt[k]=v; patch.goalAmt[k]=v;}});
  if(undo.imports){
    S.imports=JSON.parse(JSON.stringify(undo.imports));
    ["joseph","melissa"].forEach(sc=>Object.entries(S.imports[sc]||{})
      .forEach(([m,rec])=>patch.setImports.push({scope:sc,month:m,rec})));
  }
  queueSave(patch); applyImports();
}

function renderExecDone(actions){
  const out=$("#ask-out"); if(!out) return;
  out.innerHTML=`<div class="execbox done">
    <div class="exec-h"><span class="chip pine">Applied</span>
      <b>${actions.length} change${actions.length===1?"":"s"} saved</b></div>
    <div class="exec-list">${actions.map(a=>`<div class="exec-row">
      <span class="exec-l">${esc(a.label)}</span>
      <span class="exec-d num">${esc(a.detail||"")}</span></div>`).join("")}</div>
    <div class="exec-actions"><button class="btn" id="exec-undo">Undo</button>
      <span class="exec-note" style="margin:0">Saved for everyone with the passcode.</span></div></div>`;
  $("#exec-undo").onclick=()=>{
    if(!EXEC.undo) return;
    revertActions(EXEC.undo); EXEC.undo=null;
    renderMonthPick(); renderFill(); renderStmtPanel($("#stmt-panel")?.dataset.open==="1"); refresh();
    renderExecMessage("Reverted. Everything is back as it was.",false);
  };
}

function renderExecMessage(text,isError){
  const out=$("#ask-out"); if(!out) return;
  out.innerHTML=`<div class="execbox${isError?" bad":""}">
    <div class="exec-h"><span class="chip ${isError?"clay":"pine"}">${isError?"Not understood":"Done"}</span>
      <b>${esc(text)}</b></div>
    ${isError?`<div class="exec-note">Instructions it understands:
      <br>· <i>set my cash balance to 12,000</i> — also investment, CPF OA, and Melissa's or the combined figures
      <br>· <i>increase the wedding goal by 5k</i> — set, increase, reduce or reset any goal
      <br>· <i>delete Joseph's July statement</i> — or all of them
      <br>· <i>show June 2026</i> · <i>open the Combined tab</i> · <i>36 month horizon</i> · <i>include Melissa's income</i>
      <br>Anything it doesn't recognise as an instruction is answered as a question instead.</div>`:""}</div>`;
}

function parseAsk(q){
  const s=q.toLowerCase();
  const m=s.replace(/,/g,"").match(/\$?\s*(\d+(?:\.\d+)?)\s*(k\b)?/);
  let amount=m?parseFloat(m[1])*(m[2]?1000:1):null;
  if(amount!=null&&amount<100&&!/\bk\b/.test(s)) amount=null;
  const goal=M.goals.find(g=>s.includes(g.name.toLowerCase()));
  if(/afford|trip|holiday|buy|spend/.test(s)) return {kind:"afford",amount,goal};
  if(/costs? more|more expensive|overrun|goes up/.test(s)) return {kind:"overrun",amount,goal};
  if(/on time|all three|hit all|can i hit/.test(s)) return {kind:"feasible",amount,goal};
  return {kind:"deploy",amount,goal};
}
function ask(){execute();}

function buildOptions(intent,q){
  const pr=project(), plan=pr.plan, opts=[];
  const surplus=pr.net-plan.cashPerMonth-plan.loanPerMonth;
  const mk=(t,w,i,tr,p)=>opts.push({title:t,why:w,impacts:i,tradeoff:tr,preview:p});
  const soonest=plan.rows.slice().sort((a,b)=>a.due-b.due)[0];
  const biggest=plan.rows.slice().sort((a,b)=>b.amt-a.amt)[0];

  /* No goals attributed to this person — every branch below reasons about a
     goal, so answer the question honestly instead of inventing one. */
  if(!plan.rows.length){
    mk(`No goals sit on ${esc(M.scope.person)}'s tab`,
      `Goals are household-scale and are held once, on the shared <b>Combined</b> tab, costed against combined income. Nothing here claims a share of them, so there is no trade-off on this tab to weigh.${
        M.isPlaceholder?` The ledger is empty too, until the source sheet is named — so there is no spending pattern to reason from yet.`:""}`,
      [["Cash / mo",pr.net,pr.net<0?"bad":"good"],["Goals",0,"neutral"],
       ["Liquidity",pr.net,pr.net<0?"bad":"good"],["Timeline",0,"neutral"]],
      M.isPlaceholder?`Any answer here would be built on an assumed spending pattern rather than a recorded one.`
                     :`Ask this on the Combined tab, where both incomes are counted against the goals.`,null);
    return opts;
  }

  if(intent.kind==="feasible"||intent.kind==="deploy"&&!intent.amount){
    mk("The plan needs "+fmt(plan.cashPerMonth)+"/month in cash",
      `${plan.rows.map(r=>esc(r.g.name)+" "+fmt(r.cashPerMonth)).join(", ")}${plan.loanPerMonth?`, plus ${fmt(plan.loanPerMonth)} to your mum`:""}. Against ${fmt(pr.net)} of monthly net that leaves <b>${fmt(surplus,{signed:true})}</b>.`,
      [["Cash / mo",surplus,surplus<0?"bad":"good"],["Goals",0,"neutral"],["Liquidity",surplus,surplus<0?"bad":"good"],["Timeline",0,"neutral"]],
      surplus<0?`The gap is ${fmt(Math.abs(surplus))}/month. Something has to move: a date, an amount, or Melissa's income joining the projection.`:null,null);
    if(soonest) mk(`${soonest.g.name} is the binding constraint`,
      `${fmt(soonest.amt)} in ${soonest.months} months is ${fmt(soonest.cashPerMonth)}/month on its own — ${pr.net>0?Math.round(soonest.cashPerMonth/pr.net*100)+"% of your entire net":"more than your entire net"}. It lands before anything else and consumes the runway the others need.`,
      [["Cash / mo",-soonest.cashPerMonth,"bad"],["Goals",soonest.amt,"good"],["Liquidity",-soonest.cashPerMonth,"warn"],["Timeline",0,"neutral"]],
      `Pushing it out is the single biggest lever — drag it on the map to see how far.`,null);
    if(plan.cpfAvail==null) mk("Enter your CPF balance before deciding anything",
      `BTO is ${fmt(plan.rows.find(r=>r.g.key==="bto")?.amt)} and is meant to draw CPF first. With no CPF balance recorded it is being counted as <b>100% cash</b>, which is the worst case. The real cash requirement is almost certainly lower.`,
      [["Cash / mo",0,"neutral"],["Goals",0,"neutral"],["Liquidity",0,"good"],["Timeline",0,"neutral"]],
      `Until then every number on this page overstates the cash you need.`,null);
  }
  else if(intent.kind==="afford"&&intent.amount){
    const amt=intent.amount;
    mk(surplus>0?`Affordable — it costs ${Math.ceil(amt/surplus)} month${Math.ceil(amt/surplus)===1?"":"s"} of surplus`:"Not affordable without moving a goal",
      surplus>0?`After every goal contribution you keep ${fmt(surplus)}/month. ${fmt(amt)} is ${(amt/surplus).toFixed(1)}× that.`
               :`Your goals already need ${fmt(plan.cashPerMonth+plan.loanPerMonth)}/month against ${fmt(pr.net)} of net. There is no surplus for ${fmt(amt)} — it would come straight out of a goal.`,
      [["Cash now",-amt,"bad"],["Goals",surplus>0?0:-amt,surplus>0?"neutral":"bad"],["Liquidity",-amt,"warn"],["Timeline",0,"neutral"]],
      cashBalance()==null?"No cash balance entered, so this can't be checked against what you actually hold.":null,
      {label:q.slice(0,22),amount:amt,month:M.today});
    if(soonest) mk(`Delay it until after ${soonest.g.name}`,
      `${soonest.g.name} clears ${miLong(soonest.due)}. After that ${fmt(soonest.cashPerMonth)}/month frees up and ${fmt(amt)} takes ${Math.ceil(amt/Math.max(soonest.cashPerMonth,1))} months to rebuild.`,
      [["Cash now",0,"good"],["Goals",0,"good"],["Liquidity",0,"good"],["Timeline",-amt,"warn"]],
      `${Math.max(0,soonest.due-M.today)} months of waiting.`,null);
    mk("Take it from the emergency fund",
      `The floor is ${fmt(M.ef?.amount)} — two months of combined take-home. Dropping ${fmt(amt)} leaves ${fmt((M.ef?.amount||0)-amt)}, i.e. ${(((M.ef?.amount||0)-amt)/(M.salary.takeHome||1)).toFixed(1)} months of cover.`,
      [["Cash now",-amt,"warn"],["Goals",0,"neutral"],["Liquidity",-amt,"bad"],["Timeline",0,"neutral"]],
      `The emergency fund is the only thing standing between a bad month and a missed goal.`,null);
  }
  else{
    const g=intent.goal?plan.rows.find(r=>r.g.key===intent.goal.key):plan.rows.find(r=>/renovation/i.test(r.g.name))||biggest;
    const bump=intent.amount||10000;
    mk("Absorb it",
      `${g.g.name} rises from ${fmt(g.amt)} to ${fmt(g.amt+bump)} — ${fmt((g.amt+bump)/g.months)}/month instead of ${fmt(g.cashPerMonth)}. That is ${fmt(bump/g.months)}/month more out of a ${fmt(surplus,{signed:true})} surplus.`,
      [["Cash / mo",-bump/g.months,"bad"],["Goals",-bump,"warn"],["Liquidity",-bump,"warn"],["Timeline",0,"neutral"]],
      surplus-bump/g.months<0?`This pushes you ${fmt(Math.abs(surplus-bump/g.months))}/month underwater.`:null,
      {label:g.g.name+" +"+fmt(bump,{compact:true}),amount:bump,month:Math.max(g.due,M.today)});
    mk("Push the date",
      `Hold the contribution and move ${g.g.name} later. ${g.g.hardDeadline?"⚠ This one has a hard deadline — it can't move without consequence.":"It has no hard deadline, so this is the cheapest lever you have."}`,
      [["Cash / mo",0,"good"],["Goals",0,"neutral"],["Liquidity",0,"good"],["Timeline",-bump,g.g.hardDeadline?"bad":"warn"]],
      g.g.hardDeadline?`${g.g.name} is fixed to ${miLong(g.due)}.`:null,null);
    mk("Trim the amount instead",
      `Cut ${g.g.name} by ${fmt(bump)} and the schedule is unchanged. Adjust it directly with the goal controls on the Combined tab.`,
      [["Cash / mo",0,"good"],["Goals",-bump,"warn"],["Liquidity",0,"neutral"],["Timeline",0,"good"]],
      `Only you can say whether ${fmt(g.amt-bump)} still buys what you want.`,null);
  }
  return opts.slice(0,3);
}
function renderAskResults(opts,isFallback){

/* ---- Ask Steven: the LLM path for genuine questions ----
   The deterministic parser above still owns every action that writes shared
   state — that stays regex + math, on purpose, so a mutation is never a
   probabilistic guess. Only free-text QUESTIONS reach the model, grounded in
   a JSON snapshot of exactly what's on screen. If the model is unreachable
   this falls back to the old canned-template answer rather than going blank. */
function buildAskContext(){
  const pr=project(), plan=pr.plan;
  const mc=mortgageCheck();
  return {
    country:"Singapore", currency:"SGD", scope:M.scope.person, viewingMonth:miLong(M.today+S.cursor),
    balancesEntered:pr.known,
    netWorthToday:pr.known?pr.rows[0].nw:null,
    monthlyIncome:Math.round(pr.B.income), monthlyExpense:Math.round(pr.B.expense), monthlyNet:Math.round(pr.net),
    combinedGrossMonthly:M.salary.gross, combinedTakeHomeMonthly:M.salary.takeHome,
    goals:plan.rows.map(r=>({name:r.g.name, amount:r.amt, dueMonth:miLong(r.due), monthsLeft:r.months,
      hardDeadline:!!r.g.hardDeadline, requiredCashPerMonth:Math.round(r.cashPerMonth),
      fundedBy:r.g.fundedBy||[], cpfBalanceKnown:!r.cpfUnknown, note:r.g.note||null})),
    goalCashPerMonthTotal:Math.round(plan.cashPerMonth),
    loanRepaymentPerMonth:Math.round(plan.loanPerMonth),
    surplusPerMonth:Math.round(pr.net-plan.cashPerMonth-plan.loanPerMonth),
    emergencyFund:M.ef?{requiredAmount:M.ef.amount, basisMonths:M.ef.months, cashHeld:cashBalance()}:null,
    liabilities:M.liabilities.filter(l=>!l.placeholder).map(l=>({name:l.name, outstandingToday:liabilityAt(l,M.today),
      monthlyRepayment:l.repayMonthly, note:l.note||null})),
    mortgageAffordability:mc,
    balances:Object.fromEntries(M.balanceFields.map(f=>[f.label,balVal(f.key)])),
    assumptionsInUse:{idleCashParkingYieldAnnual:M.assumptions?.parkingYieldAnnual??null,
      note:"Applied to the cash portion of each goal's required monthly saving. CPF's own interest is not modelled."}
  };
}
async function askSteven(q){
  renderAskLoading(q);
  try{
    const r=await fetch("/api/ask",{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q,context:buildAskContext()})});
    if(!r.ok) throw new Error("llm-failed");
    const data=await r.json();
    if(!data.answer) throw new Error("llm-empty");
    renderAskAnswer(data,q);
  }catch(_){
    renderAskResults(buildOptions(parseAsk(q),q),true);
  }
}
function renderAskLoading(q){
  const out=$("#ask-out"); if(!out) return;
  out.innerHTML=`<div class="execbox"><div class="exec-h"><span class="chip clay plain">Thinking…</span>
    <b>${esc(q)}</b></div></div>`;
}
function renderAskAnswer(data,q){

  out.innerHTML=`<div class="opt" style="grid-column:1/-1">
    <div><span class="chip pine plain">Steven · AI-generated, verify anything you'll act on</span></div>
    <div class="o-why" style="font-size:14px;color:var(--ink);margin-top:8px">${esc(data.answer)}</div>
    ${data.caveats&&data.caveats.length?`<div class="tradeoff" style="align-items:flex-start">
      <span>Assuming</span><span>${data.caveats.map(esc).join(" · ")}</span></div>`:""}

/* ================= 8b. STATEMENT IMPORT =============================
   The file is read in this browser and nothing else. It is not uploaded, not
   posted anywhere, and the handle is dropped the moment parsing finishes.
   What can be saved is the derived total: a month, a transaction count and
   per-category sums. Merchant names and the raw text are shown for checking
   and then discarded with the page — they are never part of a save.

   pdf.js is fetched from a CDN on first use. That request carries no statement
   data; it is a library download, and only happens if you open a PDF.        */
const PDFJS_URL="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
const PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const STMT={parsed:null, busy:false, needsPassword:false, note:"", range:null};

/* ---- statement period ----------------------------------------------------
   Card statements straddle two calendar months and often print day+month with
   no year, so guessing the year from stray 4-digit numbers in the document
   gets it wrong. The period is chosen explicitly instead.

   The list runs from May 2026 to whatever the current month actually is, read
   from the clock rather than the data file, so it extends itself as months
   pass with no edit here. */
const STMT_FIRST=mi(2026,4);                        // May 2026
function stmtCurrentMonth(){const d=new Date(); return mi(d.getFullYear(),d.getMonth());}
function stmtRanges(){
  const end=Math.max(stmtCurrentMonth(),STMT_FIRST);
  const out=[];
  for(let b=STMT_FIRST+1;b<=end;b++) out.push({a:b-1,b});
  if(!out.length) out.push({a:STMT_FIRST,b:STMT_FIRST});   // only reachable in May 2026 itself
  return out.reverse();                                    // newest first — the usual upload
}
function rangeLabel(r){
  if(r.a===r.b) return miLong(r.a);
  return miY(r.a)===miY(r.b)
    ? `${MON[miM(r.a)]}–${MON[miM(r.b)]} ${miY(r.b)}`
    : `${MON[miM(r.a)]} ${miY(r.a)}–${MON[miM(r.b)]} ${miY(r.b)}`;
}
const rangeKey=r=>r.a+":"+r.b;
function currentRange(){
  const all=stmtRanges();
  return all.find(r=>rangeKey(r)===STMT.range)||all[0];
}

/** Pins each row into the chosen two-month window by its own month-of-year,
 *  which settles the year at the same time. Anything outside the window is
 *  dropped and counted rather than quietly folded into the wrong month. */
function applyRange(rows,range){
  const aM=miM(range.a), aY=miY(range.a), bM=miM(range.b), bY=miY(range.b);
  const kept=[]; let dropped=0;
  rows.forEach(r=>{
    if(r.when.m===aM){r.when.y=aY; kept.push(r);}
    else if(r.when.m===bM){r.when.y=bY; kept.push(r);}
    else dropped++;
  });
  return {kept,dropped};
}

/* Categories: the sheet's own taxonomy, so imports and the ledger speak the
   same language. Groceries and Shopping are added because card statements are
   full of both and folding them into Miscellaneous throws away the answer. */
const CAT_RULES=[
  ["Food & Drinks",  /(mcdonald|kfc|burger|pizza|subway|starbucks|coffee|cafe|café|restaurant|eatery|kopitiam|food ?court|foodpanda|deliveroo|grabfood|bakery|sushi|ramen|bubble ?tea|liho|koi|gong ?cha|swensen|crystal ?jade|din ?tai ?fung|jollibee|old ?chang ?kee|ya ?kun|breadtalk|tim ?ho ?wan|haidilao|dim ?sum|bar\b|pub\b|brewery|tea\b)/i],
  ["Groceries",      /(ntuc|fairprice|cold ?storage|giant\b|sheng ?siong|redmart|prime ?super|donki|don ?don|mustafa|hao ?mart|u ?stars|marketplace)/i],
  ["Transport",      /(grab(?!food)|gojek|comfort ?del|cdg ?taxi|taxi|transitlink|simplygo|ez-?link|bus\/mrt|smrt|sbs ?transit|shell|esso|caltex|\bspc\b|sinopec|parking|carpark|car ?park|season ?park|\bura\b|\blta\b|erp)/i],
  ["Travel",         /(airline|singapore ?air|\bsia\b|scoot|jetstar|airasia|emirates|qatar|cathay|agoda|booking\.com|expedia|hotel|resort|airbnb|klook|trip\.com|traveloka|changi|duty ?free|\bavis\b|hertz)/i],
  ["Insurance",      /(insurance|prudential|\baia\b|great ?eastern|ntuc ?income|\baxa\b|manulife|aviva|singlife|\bfwd\b|tokio ?marine)/i],
  ["Handphone Bills",/(singtel|starhub|\bm1\b|circles\.?life|simba|\btpg\b|giga\b|myrepublic)/i],
  ["Gym Membership", /(gym|fitness|anytime ?fit|virgin ?active|\bf45\b|pure ?fitness|activesg|climb|yoga|pilates)/i],
  ["Firstfruits",    /(church|tithe|offering|firstfruit|\bcru\b)/i],
  ["Shopping",       /(shopee|lazada|amazon|taobao|uniqlo|zara|h ?& ?m|cotton ?on|decathlon|ikea|courts|harvey ?norman|challenger|apple\.com|apple ?store|love ?bonito|sephora|watsons|guardian|\bmuji\b|daiso|popular|best ?denki)/i]
];
const CATEGORIES=CAT_RULES.map(x=>x[0]);
const CAT_DEFAULT="Needs Review";
function normaliseMerchant(value){
  return String(value||"").toUpperCase().replace(/\bGRAB\s*\*?\s*FOOD\b/g,"GRABFOOD")
    .replace(/\b(PAYPAL\*?|SQ \*?|CARD\s*\d{4}|\d{5,}|SGP?|SINGAPORE)\b/g," ")
    .replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim().slice(0,80);
}
function merchantKeywords(value){ return normaliseMerchant(value).split(" ").filter(x=>x.length>2).slice(0,5); }
function categorise(merchant){
  const normalised=normaliseMerchant(merchant), rules=S.merchantRules||[];
  const exact=rules.find(r=>r.merchant===normalised);
  if(exact) return {category:exact.category, source:"learned", count:exact.correctionCount, normalised};
  const keywords=merchantKeywords(merchant);
  const strong=rules.find(r=>r.correctionCount>=2 && (r.keywords||[]).filter(k=>keywords.includes(k)).length>=2);
  if(strong) return {category:strong.category, source:"keyword", count:strong.correctionCount, normalised};
  for(const [name,re] of CAT_RULES) if(re.test(merchant)) return {category:name, source:"merchant", normalised};
  return {category:CAT_DEFAULT, source:"review", normalised};
}
function rememberMerchant(line){
  const old=(S.merchantRules||[]).find(r=>r.merchant===line.normalised);
  const rule={merchant:line.normalised,keywords:merchantKeywords(line.normalised),category:line.cat,
    correctionCount:(old?.correctionCount||0)+1,lastCorrectedAt:new Date().toISOString()};
  S.merchantRules=(S.merchantRules||[]).filter(r=>r.merchant!==rule.merchant).concat([rule]);
  queueSave({upsertMerchantRules:[rule]});
}

/* Rows that are not spending: payments to the card, refunds, and the summary
   block. Getting this wrong inflates or deflates the month, so it is explicit. */
const NOT_SPEND=/(payment[ -]*(thank|received|ref)|thank ?you|previous ?balance|statement ?balance|closing ?balance|opening ?balance|total ?amount ?due|minimum ?payment|sub-?total|grand ?total|credit ?limit|available ?credit|balance ?b\/?f|autopay|giro ?deduction|refund|reversal|rebate|cashback|\bcr\b$)/i;

const MONTH_ABBR={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

function stmtAmount(text){
  if(!text) return null;
  const neg=/^\(|\)$/.test(text.trim());
  const n=parseFloat(String(text).replace(/[^0-9.]/g,""));
  if(!isFinite(n)) return null;
  return neg?-n:n;
}

/** Rebuilds visual lines from pdf.js text items: cluster by y, order by x.
 *  Without this a statement arrives as a bag of fragments in no useful order. */
function pdfPageLines(items){
  const rows=[];
  for(const it of items){
    if(!it.str||!it.str.trim()) continue;
    const x=(it.transform&&Number(it.transform[4]))||0;
    const y=(it.transform&&Number(it.transform[5]))||0;
    let row=rows.find(r=>Math.abs(r.y-y)<2.5);
    if(!row){row={y,parts:[]}; rows.push(row);}
    row.parts.push({x,text:it.str});
  }
  return rows.sort((a,b)=>b.y-a.y)
    .map(r=>r.parts.sort((a,b)=>a.x-b.x).map(p=>p.text).join(" ").replace(/\s+/g," ").trim())
    .filter(Boolean);
}

async function stmtText(file,password){
  if(/\.pdf$/i.test(file.name)){
    const pdfjs=await import(PDFJS_URL);
    pdfjs.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    const doc=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()),
                                       password:password||undefined}).promise;
    const pages=[];
    for(let p=1;p<=doc.numPages;p++){
      const page=await doc.getPage(p);
      pages.push(pdfPageLines((await page.getTextContent()).items).join("\n"));
    }
    try{doc.destroy();}catch(_){}
    return pages.join("\n");
  }
  return file.text();
}

/* ---- structured CSV first; banks that export it give clean columns ---- */
function splitCSVLine(line,delim){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){out.push(cur);cur="";}
    else cur+=c;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return null;
  const delim=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?";":",";
  const head=splitCSVLine(lines[0],delim).map(h=>h.toLowerCase());
  const col=(...names)=>head.findIndex(h=>names.some(n=>h.includes(n)));
  const di=col("date"), mi_=col("description","merchant","details","particulars","narrative","reference"),
        ai=col("amount","debit","withdrawal","sgd"), ci=col("credit","deposit");
  if(di<0||ai<0) return null;
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const c=splitCSVLine(lines[i],delim);
    if(c.length<=Math.max(di,ai)) continue;
    if(ci>=0&&c[ci]&&stmtAmount(c[ci])) continue;             // a credit, not spend
    const amount=stmtAmount(c[ai]);
    const merchant=(mi_>=0?c[mi_]:"").replace(/\s{2,}/g," ").trim();
    const when=parseStmtDate(c[di]);
    if(amount==null||amount<=0||!when||!merchant) continue;
    if(NOT_SPEND.test(merchant)) continue;
    rows.push({merchant,amount,when});
  }
  return rows.length?rows:null;
}

/** Handles "12 Jul 2026", "12/07/2026", "2026-07-12", "12 JUL". Year may be
 *  absent on Singapore card statements, so it is returned as null and inferred
 *  later from the document rather than guessed per row. */
function parseStmtDate(s){
  if(!s) return null;
  const t=String(s).trim();
  let m;
  if((m=t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return {y:+m[1],m:+m[2]-1,d:+m[3]};
  if((m=t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/))){
    let y=+m[3]; if(y<100) y+=2000;
    return {y,m:+m[2]-1,d:+m[1]};                              // DD/MM/YYYY (SG)
  }
  if((m=t.match(/^(\d{1,2})\s*[-\s]\s*([A-Za-z]{3})[a-z]*\s*(\d{2,4})?/))){
    const mo=MONTH_ABBR[m[2].toLowerCase()];
    if(mo==null) return null;
    let y=m[3]?+m[3]:null; if(y!=null&&y<100) y+=2000;
    return {y,m:mo,d:+m[1]};
  }
  if((m=t.match(/^([A-Za-z]{3})[a-z]*\s+(\d{1,2}),?\s*(\d{2,4})?/))){
    const mo=MONTH_ABBR[m[1].toLowerCase()];
    if(mo==null) return null;
    let y=m[3]?+m[3]:null; if(y!=null&&y<100) y+=2000;
    return {y,m:mo,d:+m[2]};
  }
  return null;
}

const DATE_LEAD=/^((\d{4}-\d{2}-\d{2})|(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})|(\d{1,2}\s*[-\s]\s*[A-Za-z]{3}[a-z]*(\s+\d{2,4})?)|([A-Za-z]{3}[a-z]*\s+\d{1,2},?(\s+\d{2,4})?))/;

function parseLines(text){
  const rows=[];
  for(const raw of text.split(/\n/)){
    const line=raw.replace(/\s+/g," ").trim();
    if(!line||line.length<8) continue;
    const dm=line.match(DATE_LEAD);
    if(!dm) continue;
    const when=parseStmtDate(dm[0]);
    if(!when) continue;
    const amounts=line.match(/\(?-?(?:S\$|SGD)?\s*\d[\d,]*\.\d{2}\)?(?:\s*CR)?/gi)||[];
    if(!amounts.length) continue;
    const amountText=amounts[amounts.length-1];
    if(/CR\s*$/i.test(amountText)) continue;                   // credit, not spend
    const amount=stmtAmount(amountText);
    let merchant=line.replace(dm[0],"");
    amounts.forEach(a=>{merchant=merchant.replace(a,"");});
    merchant=merchant.replace(/\b(S\$|SGD)\b/g,"").replace(/\s{2,}/g," ").trim();
    if(!merchant||amount==null||amount<=0) continue;
    if(NOT_SPEND.test(merchant)||NOT_SPEND.test(line)) continue;
    rows.push({merchant,amount,when});
  }
  return rows;
}

/** Fills in missing years. Statements print "12 JUL" and put the year only in
 *  the header, so the document's own year is used, and a month later than the
 *  statement year-end rolls back rather than landing in the future. */
function inferYears(rows,text){
  const years=(text.match(/\b(20\d{2})\b/g)||[]).map(Number)
    .filter(y=>y>=2000&&y<=miY(M.today)+1);
  const docYear=years.length?Math.max(...years):miY(M.today);
  rows.forEach(r=>{
    if(r.when.y!=null) return;
    let y=docYear;
    if(mi(y,r.when.m)>M.today+1) y-=1;                          // don't land in the future
    r.when.y=y;
  });
  return rows;
}

function groupByMonth(rows){
  const out={};
  rows.forEach(r=>{
    const key=r.when.y+"-"+String(r.when.m+1).padStart(2,"0");
    const g=out[key]||(out[key]={total:0,count:0,cats:{},lines:[]});
    const choice=categorise(r.merchant), cat=choice.category;
    g.total+=r.amount; g.count+=1;
    g.cats[cat]=(g.cats[cat]||0)+r.amount;
    g.lines.push({merchant:r.merchant,amount:r.amount,cat,day:r.when.d,normalised:choice.normalised,
      source:choice.source,count:choice.count||0,remember:choice.source==="review"});
  });
  Object.values(out).forEach(g=>{
    g.total=Math.round(g.total*100)/100;
    Object.keys(g.cats).forEach(k=>{g.cats[k]=Math.round(g.cats[k]*100)/100;});
    g.lines.sort((a,b)=>b.amount-a.amount);
  });
  return out;
}

/* A one-way duplicate guard. The raw statement never leaves this tab; only this
   SHA-256 digest of temporary date/merchant/amount rows is persisted with the
   already-approved monthly aggregates. */
async function statementFingerprint(rows){
  const canonical=rows.map(r=>[r.when.y,r.when.m,r.when.d,normaliseMerchant(r.merchant),r.amount.toFixed(2)].join("|")).sort().join("\n");
  const bytes=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(canonical)));
  return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");
}

async function runStatement(){
  const input=$("#stmt-file"), status=$("#stmt-status");
  const file=input&&input.files&&input.files[0];
  if(!file){setStmtStatus("Choose a CSV, TXT or text-based PDF statement first.","clay"); return;}
  if(STMT.busy) return;
  STMT.busy=true; setStmtStatus("Reading in this browser…","grey");
  const pw=($("#stmt-pw")&&$("#stmt-pw").value)||"";
  try{
    const text=await stmtText(file,pw);
    let rows=/\.csv$/i.test(file.name)?parseCSV(text):null;
    let how=rows?"CSV columns":"line matching";
    if(!rows){rows=parseLines(text); how="line matching";}
    if(!rows.length) throw new Error("no-rows");
    const sel=$("#stmt-range")&&$("#stmt-range").value;
    let dropped=0, period=null;
    if(sel&&sel!=="auto"){
      const range=stmtRanges().find(r=>rangeKey(r)===sel)||currentRange();
      STMT.range=rangeKey(range);
      const res=applyRange(rows,range);
      rows=res.kept; dropped=res.dropped; period=rangeLabel(range);
      if(!rows.length) throw new Error("none-in-period");
    }else{
      inferYears(rows,text);
    }
    const months=groupByMonth(rows), statementId=await statementFingerprint(rows);
    STMT.parsed={months,statementId,how,count:rows.length,period,dropped};
    STMT.needsPassword=false;
    setStmtStatus(`Read ${rows.length} purchase${rows.length===1?"":"s"} via ${how}`
      +(period?` and dated into ${esc(period)}`:"")+`. The file has been closed.`
      +(dropped?` <b>${dropped}</b> row${dropped===1?" was":"s were"} outside that period and left out.`:""),"pine");
    renderStmtReview();
  }catch(e){
    const msg=String(e&&e.message||e);
    if(/password/i.test(msg)){
      STMT.needsPassword=true;
      setStmtStatus("This PDF needs its statement password. Enter it above — it is used in this browser only and is never stored or sent.","clay");
      renderStmtPanel(true);
    } else if(msg==="no-rows"){
      setStmtStatus("No purchase rows could be read. Export a CSV from your bank, or use a PDF with selectable text (a scan or photo won't work).","clay");
    } else if(msg==="none-in-period"){
      setStmtStatus("Rows were read, but none of them fall in the period you picked. Choose the period this statement actually covers.","clay");
    } else {
      setStmtStatus("Could not read that file: "+esc(msg),"clay");
    }
    STMT.parsed=null;
    renderStmtReview();
  } finally {
    STMT.busy=false;
    if(input) input.value="";            // drop the handle; the copy is gone
    const pwEl=$("#stmt-pw"); if(pwEl) pwEl.value="";
    const nm=$("#stmt-name"); if(nm) nm.textContent="No file chosen";
  }
}

    if(!toSave.length){setStmtStatus("This statement was already saved. Nothing was added twice.","grey"); return;}
    recalc();
    const rules=[];
    toSave.forEach(k=>p.months[k].lines.filter(l=>l.remember&&l.cat!==CAT_DEFAULT).forEach(l=>{rememberMerchant(l); rules.push(l.normalised);}));
    const sets=toSave.map(k=>{const g=p.months[k];
      S.imports[ACTIVE]=S.imports[ACTIVE]||{};
      const rec={total:g.total,count:g.count,cats:g.cats,statementId:p.statementId,at:new Date().toISOString()};
      S.imports[ACTIVE][k]=rec;                       // note: g.lines is NOT included
      return {scope:ACTIVE,month:k,rec};});
    queueSave({setImports:sets});
    applyImports();
    setStmtStatus("Saving securely…","grey");
    const saved=await flushSave();
    if(!saved){
      const ruleUpdates=[...new Map(rules.map(k=>[k,(S.merchantRules||[]).find(r=>r.merchant===k)])).values()].filter(Boolean);
      queueSave({setImports:sets,upsertMerchantRules:ruleUpdates});
      setStmtStatus("Not confirmed on the shared dashboard yet. Keep this page open and retry when the sync chip is green.","clay");
      return;
    }
    STMT.parsed=null;
    setStmtStatus(`Saved ${toSave.length} month${toSave.length===1?"":"s"}${toSave.length!==picked.length?"; duplicate month skipped":""}${rules.length?` and learned ${new Set(rules).size} merchant${new Set(rules).size===1?"":"s"}`:""}. The statement itself was never stored.`,"pine");
    renderMonthPick(); renderStmtPanel(true); refresh();
  };
}

function renderBrief(){
  const host=$("#p-brief"); if(!host) return;
  const pr=project(), plan=pr.plan;
  const surplus=pr.net-plan.cashPerMonth-plan.loanPerMonth;
  const items=[]; const push=(tone,icon,title,desc)=>items.push({tone,icon,title,desc});

  if(surplus<0) push("clay","!","The plan does not fit the income",
    `Your three goals need <b>${fmt(plan.cashPerMonth)}/month</b> in cash${plan.loanPerMonth?`, plus <b>${fmt(plan.loanPerMonth)}</b> to your mum`:""}, against <b>${fmt(pr.net)}</b> of monthly net. That is a <b>${fmt(Math.abs(surplus))}/month</b> gap. ${S.includeMelissa?"":`Melissa's ${fmt(M.proj.melissaMonthly)} take-home is not in this projection — adding it closes ${fmt(Math.min(Math.abs(surplus),M.proj.melissaMonthly||0))} of it.`}`);
  else push("pine","$","The plan fits, with room",
    `After every goal contribution and the loan repayment you keep <b>${fmt(surplus)}/month</b>.`);

  const soon=plan.rows.slice().sort((a,b)=>a.due-b.due)[0];
  if(soon) push("clay","▲",`${soon.g.name} is the binding constraint`,
    `<b>${fmt(soon.amt)}</b> by <b>${miLong(soon.due)}</b> — ${soon.months} months away, so <b>${fmt(soon.cashPerMonth)}/month</b>. It is the earliest and steepest claim; everything else queues behind it.`);

  const bto=plan.rows.find(r=>r.g.key==="bto");
  if(bto){
    if(bto.cpfUnknown) push("clay","?","BTO is being costed as all cash",
      `<b>${fmt(bto.amt)}</b> by ${miLong(bto.due)} is meant to draw CPF first. No CPF balance is recorded, so it is showing as <b>100% cash</b> — the worst case. Enter both CPF balances and this number will fall.`);
    else push("pine","◆","BTO splits CPF first, then cash",
      `<b>${fmt(bto.cpfPart)}</b> from CPF and <b>${fmt(bto.cashPart)}</b> from cash, on ${fmt(plan.cpfAvail)} of CPF today plus ${fmt(plan.monthlyCPF)}/month accruing to ${miLong(bto.due)}. Assumes the balance you entered is usable for housing.`);
  }

  const ef=M.ef;
  if(ef){
    const cash=cashBalance();
    push(cash==null?"grey":(cash>=ef.amount?"pine":"clay"), "◇", "Emergency fund floor",
      `<b>${fmt(ef.amount)}</b> — ${ef.months} months of combined take-home, held in cash. ${cash==null?"No cash balance entered, so it can't be checked.":cash>=ef.amount?`Your ${fmt(cash)} cash covers it with ${fmt(cash-ef.amount)} to spare.`:`Your ${fmt(cash)} cash is <b>${fmt(ef.amount-cash)} short</b> of it. This is not a goal you can defer — it is the floor.`}`);
  }

  const sl=M.liabilities.find(l=>l.repayIdx!=null);
  if(sl) push("pine","→",`${sl.name} amortises from ${miLong(sl.repayIdx)}`,
    `<b>${fmt(sl.outstanding)}</b> to your mum, falling ${fmt(sl.repayMonthly)}/month — clear in <b>${Math.ceil(sl.outstanding/sl.repayMonthly)} months</b>, ${miLong(sl.repayIdx+Math.ceil(sl.outstanding/sl.repayMonthly)-1)}. Cash out but net-worth neutral, so the line doesn't dip for it.`);

  const done=M.months.filter(m=>!m.partial);
  if(done.length>=3) push("grey","⌁","What the trailing spend is built on",
    `Expenses run at <b>${fmt(pr.B.expense)}/month</b> on the last three complete months (${done.slice(-3).map(m=>MON[miM(m.idx)]+" "+fmt(m.expense,{compact:true})).join(", ")}). July carried ${fmt(M.expenseCats[0]?.amount)} of ${esc(M.expenseCats[0]?.name||"")}, so this basis is high — one clean month will move it.`);

  (M.raw.decisions||[]).forEach(x=>push("pine","→",esc(x.name),esc(x.detail)));

  const T={clay:"var(--neg)",pine:"var(--pine)",grey:"var(--ink-faint)"};
  host.innerHTML=`<div class="sec-head"><h2>Finance brief</h2>
      <span class="hint">decisions ahead of statistics</span></div>
    ${items.map(it=>`<div class="bitem">
      <div class="bi" style="background:${it.tone==="clay"?"var(--neg-soft)":it.tone==="pine"?"var(--pine-soft)":"var(--paper-2)"};color:${T[it.tone]}">${it.icon}</div>
      <div><div class="bt" style="color:${T[it.tone]}">${it.title}</div><div class="bd">${it.desc}</div></div></div>`).join("")}`;
}

      <div style="font-family:var(--serif);font-size:20px">${fmt(M.ef?.amount)}</div>

        (${fmt(M.salary.takeHome)}), so it moves only when salary does.</div></div>`;

  $$("[data-amt]").forEach(inp=>inp.oninput=e=>{
    const k=e.target.dataset.amt, v=e.target.value;
    if(v===""){delete S.goalAmt[k]; queueSave({unsetGoalAmt:[k]});}
    else {S.goalAmt[k]=Math.max(0,+v); queueSave({goalAmt:{[k]:S.goalAmt[k]}});}
    refreshGoals();});
  $$("[data-step]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.goal, g=M.goals.find(x=>x.key===k);
    const cur=goalAmount(g), next=Math.max(0,cur+ +b.dataset.step);
    S.goalAmt[k]=next; queueSave({goalAmt:{[k]:next}}); refreshGoals();});
  renderPlanSummary();
}

                may bring in general Singapore financial knowledge (CPF, MSR/TDSR, T-bills) when relevant — always

          </ul>

      </div>
      <div class="card pad">
        <h2 class="faq-q">What it will never do</h2>
        <div class="faq-a">
          <ul>

            <li><b>Move money.</b> It has no account access and cannot transact.</li>
            <li><b>Give investment advice.</b> That is a different specialist, and neither is a licensed adviser.</li>
            <li><b>Silently resolve a conflict.</b> Two sources disagreeing is surfaced, not averaged.</li>
            <li><b>Overwrite what you typed.</b> Balances entered on this page stay in your browser
                until you deliberately export them.</li>
          </ul>
          It also cannot see your bank. Everything it knows, one of you typed into the sheet.</div>
      </div>
    </div>`;
}

function refresh(){refreshExceptFill(); if($("#p-bars")) renderBars();}
function refreshGoals(){renderGoalDetail(); renderGoalEditors(); refreshExceptFill();}

async function boot(dJoseph,dMelissa){
  const combinedRaw=buildCombinedRaw(dJoseph,dMelissa);
  SCOPES.joseph  ={raw:dJoseph,   model:buildModel(dJoseph),   opts:{brief:true}};
  SCOPES.melissa ={raw:dMelissa,  model:buildModel(dMelissa),  opts:{brief:true}};
  SCOPES.combined={raw:combinedRaw,model:buildModel(combinedRaw),opts:{brief:false}};
  ORDER.forEach(id=>registerFields(SCOPES[id].model));

  M=SCOPES.joseph.model;
  renderShell();
  await loadState();               // server is authoritative; falls back to this device
  applyImports();
  mountPerson("joseph");
  addEventListener("resize",drawTicks);
  addEventListener("focus",syncOnFocus);
  addEventListener("beforeunload",()=>{if(!pendingEmpty(SYNC.pending)) flushSave();});
  whoami();
}
async function whoami(){
  try{
    const r=await fetch("/cdn-cgi/access/get-identity",{credentials:"include"});
    if(!r.ok) return;
    const id=await r.json();
    if(id&&id.email){
      const w=$("#who"); if(w) w.textContent="Signed in as "+id.email;
    }
  }catch(_){}
}
/* Sign out — clears the session cookie server-side, then reloads into the
   PIN screen. The cookie is HttpOnly, so only the server can clear it. */
async function signOut(){
  try{ await fetch("/__auth/logout",{method:"POST",credentials:"same-origin"}); }catch(_){}
  location.replace("/");
}

const grab=p=>fetch(p,{cache:"no-store"})
  .then(r=>{if(!r.ok) throw new Error(p+" → HTTP "+r.status); return r.json();});

Promise.all([grab("data/finance.json"),grab("data/finance-melissa.json")])
  .then(([j,m])=>boot(j,m))
  .catch(e=>{$("#root").innerHTML=
    `<div class="card pad"><div class="sec-head"><h2 style="color:var(--clay-deep)">⚠ Could not load the data files</h2></div>
     <div style="font-size:13px;color:var(--ink-soft)">${esc(e.message)}</div></div>`;});
</script>
